    html += '<div class="panel" style="padding:0">' + ps.map(function (p) {
      var a = att(g, p.id);
      var sel = '<select data-att="' + esc(p.id) + '" aria-label="Attendance for ' + esc(p.name) + '">' +
        [['playing', 'Playing'], ['absent', 'Absent'], ['sitout', 'Sat out by request']].map(function (o) {
          return '<option value="' + o[0] + '"' + (a === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select>';
      var why = a === 'absent' ? '<select data-why="' + esc(p.id) + '" aria-label="Reason ' + esc(p.name) + ' is absent">' +
        '<option value="">Reason</option>' + ABSENT_REASONS.map(function (r) { return '<option' + (g.absentReason[p.id] === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>' : '';
      return '<div class="att-row">' + jmini(p) + '<div class="nm">' + esc(p.name) + '</div><div class="sel-pair">' + sel + why + '</div></div>';
    }).join('') + '</div>';
    html += '<p class="hint" style="margin-top:0">Kids who sit out by request stay on the bench with the team. They don\'t count against fair-time warnings.</p>';
    html += '<section class="panel" style="margin-top:18px"><h2>Game options</h2><div class="row">' +
      (g.live ? '<button class="btn btn-quiet" data-action="reset-live">Clear live tracking</button>' : '') +
      '<button class="btn btn-danger" data-action="delete-game">Delete game</button></div></section>';
    return html;
  }

  function renderPlan(t, g) {
    cleanPlan(t, g);
    var F = FMT(g.format).size;
    var ps = playingPlayers(t, g), n = ps.length;
    var counts = plannedCounts(t, g);
    var pq = g.plan[planQ];
    var empty = g.plan.every(function (q) { return !Object.keys(q.slots).length; });
    var html = '<div class="toolrow"><button class="btn btn-primary" data-action="suggest">' + (empty ? 'Suggest a fair rotation' : 'Suggest a new rotation') + '</button></div>';
    html += '<div class="quarters">' + [0, 1, 2, 3].map(function (q) {
      var gap = Object.keys(g.plan[q].slots).length < Math.min(F, n);
      return '<button class="blk' + (gap ? ' gap' : '') + '" data-action="plan-q" data-q="' + q + '" aria-current="' + (q === planQ) + '">Q' + (q + 1) + '</button>';
    }).join('') + '</div>';
    html += '<div class="lineup-bar"><div><div class="lb-name">Quarter ' + (planQ + 1) + (pq.name ? ': ' + esc(pq.name) : '') + '</div>' +
            '<div class="lb-form">' + esc(formName(g.format, pq.lines)) + '</div></div>' +
            '<button class="btn btn-quiet btn-small" data-action="plan-formation">Formation</button></div>';
    html += '<div class="toolrow" style="margin-top:0"><button class="btn btn-quiet" data-action="plan-use-lineup">Use a saved lineup</button></div>';
    html += pitchSVG(t, g.format, pq.lines, pq.slots, 'plan-pos');
    html += '<p class="blk-caption">Tap a spot to choose a player.</p>';

    var onQ = Object.keys(pq.slots).map(function (k) { return pq.slots[k]; });
    var bench = ps.filter(function (p) { return onQ.indexOf(p.id) < 0; });
    html += '<h2 class="section-title">Bench for quarter ' + (planQ + 1) + '</h2>';
    html += bench.length ? '<div class="bench">' + bench.map(function (p) {
      return '<button class="chip" data-action="bench-plan" data-id="' + esc(p.id) + '">' + jmini(p) + esc(firstName(p.name)) + ' <small>' + counts[p.id] + ' qtrs</small></button>';
    }).join('') + '</div>' : '<p class="meta">Nobody on the bench.</p>';
    html += '<div class="toolrow">' +
      (planQ > 0 ? '<button class="btn btn-quiet" data-action="copy-prev">Copy Q' + planQ + '</button>' : '') +
      '<button class="btn btn-quiet" data-action="save-as-lineup">Save as lineup</button>' +
      '<button class="btn btn-quiet" data-action="clear-q">Clear</button></div>';

    var warns = planWarnings(t, g);
    html += '<h2 class="section-title">Fairness check</h2>';
    if (n > F) html += '<p class="meta">Fair share: about ' + (F * 4 / n).toFixed(1) + ' quarters each (' + n + ' players, ' + F + ' spots).</p>';
    html += warns.length ? '<ul class="warnlist">' + warns.map(function (w) { return '<li class="' + (w.bad ? 'bad' : '') + '">' + esc(w.text) + '</li>'; }).join('') + '</ul>'
                         : '<div class="okline">Every spot is filled and playing time is even.</div>';
    html += '<div class="tbl-wrap"><table class="grid"><thead><tr><th>#</th><th class="l">Player</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Total</th></tr></thead><tbody>' +
      ps.map(function (p) {
        var row = '<tr><td class="num">' + esc(p.number || '?') + '</td><td class="l">' + esc(p.name) + '</td>';
        for (var q = 0; q < 4; q++) {
          var k = keyOf(g.plan[q].slots, p.id);
          row += '<td><span class="hq1' + (k ? ' on' : '') + '" title="' + (k ? labelFor(g.format, g.plan[q].lines, k) : 'Bench') + '"></span></td>';
        }
        return row + '<td><b>' + counts[p.id] + '</b></td></tr>';
      }).join('') + '</tbody></table></div>';
    return html;
  }

  function renderLive(t, g) {
    var L = g.live;
    if (!L) {
      var planned = g.plan.some(function (q) { return Object.keys(q.slots).length; });
      return '<section class="panel"><h2>Live tracking</h2><p>Run a game clock and log subs as they happen. The app times each player and marks which quarters they played.</p>' +
        (planned ? '' : '<p class="warn">You haven\'t planned any quarters. You can still track live and fill the field by hand or from a saved lineup.</p>') +
        '<p class="meta">Keep the app open during the game. If your phone locks, the clock keeps correct time anyway.</p>' +
        '<button class="btn btn-primary" data-action="live-begin">Get ready for kickoff</button></section>';
    }
    if (L.ended) {
      return '<section class="panel"><h2>Game finished</h2><p>Your record and lineup card are ready on the Card tab.</p>' +
             '<div class="row"><button class="btn btn-primary" data-action="game-tab" data-tab="card">Open the card</button></div></section>' + renderTimes(t, g);
    }
    var e = elapsed(L), Q = g.quarterMin * 60;
    var onBreak = !L.qStarted && L.breakAt, left = breakLeft(L);
    var html;
    if (onBreak) {
      html = '<div class="clockbox"><div class="clock-q">' + breakName(L) + '</div>' +
             '<div class="clock" id="liveClock">' + clock(Math.max(0, left)) + '</div>' +
             '<div class="clock-meta' + (left <= 0 ? ' over' : '') + '" id="liveMeta">' + breakMeta(L) + '</div><div class="row">';
    } else {
      html = '<div class="clockbox"><div class="clock-q">Quarter ' + (L.q + 1) + (L.qStarted ? '' : ', ready to start') + '</div>' +
             '<div class="clock" id="liveClock">' + clock(e) + '</div>' +
             '<div class="clock-meta' + (e >= Q ? ' over' : '') + '" id="liveMeta">' + (e >= Q ? 'Time\'s up. End the quarter at the whistle.' : 'of ' + clock(Q)) + '</div><div class="row">';
    }
    if (!L.qStarted) {
      html += '<button class="btn btn-chalk" data-action="live-start">Start quarter ' + (L.q + 1) + '</button>';
      if (onBreak) html += '<button class="btn btn-outline-chalk" data-action="live-skip-break">End break</button>';
    }
    else {
      html += L.running ? '<button class="btn btn-chalk" data-action="live-pause">Pause</button>' : '<button class="btn btn-chalk" data-action="live-resume">Resume</button>';
      html += '<button class="btn btn-outline-chalk" data-action="live-end">End quarter ' + (L.q + 1) + '</button>';
    }
    html += '</div></div>';

    var planned = usableSlots(t, g, g.format, g.plan[L.q].lines, g.plan[L.q].slots);
    if (!L.qStarted && Object.keys(planned).length && !sameLineup(planned, L.onField)) {
      html += '<div class="planned"><h3>Quarter ' + (L.q + 1) + ' plan</h3><p>The field doesn\'t match your plan for this quarter.</p>' +
              '<button class="btn" data-action="live-use-plan">Use planned lineup</button></div>';
    }
    html += '<div class="toolrow" style="margin-top:0"><button class="btn btn-primary btn-sub" data-action="live-sub">Sub</button></div>';
    html += '<div class="lineup-bar"><div><div class="lb-name">On the field</div><div class="lb-form">' + esc(formName(g.format, L.lines)) + '</div></div>' +
            '<button class="btn btn-quiet btn-small" data-action="live-change-lineup">Change lineup</button></div>';
    html += pitchSVG(t, g.format, L.lines, L.onField, 'live-pos');
    html += '<p class="blk-caption">Tap a player to sub them off, or an empty spot to fill it.</p>';
    html += '<div class="toolrow"><button class="btn btn-quiet" data-action="live-goal">+ Goal</button>' +
            (L.history.length ? '<button class="btn btn-quiet" data-action="live-undo">Undo last change</button>' : '') + '</div>';
    html += renderTimes(t, g);
    return html;
  }

  function breakMeta(L) {
    return breakLeft(L) > 0 ? 'Then quarter ' + (L.q + 1) + '. Good time to plan subs.' : 'Break\'s over. Start quarter ' + (L.q + 1) + ' at the whistle.';
  }
  function renderTimes(t, g) {
    var L = g.live, mins = minutesFor(t, g);
    var ps = playingPlayers(t, g);
    var max = Math.max(60, Math.max.apply(null, ps.map(function (p) { return mins[p.id] || 0; })));
    var avg = ps.length ? ps.reduce(function (s, p) { return s + (mins[p.id] || 0); }, 0) / ps.length : 0;
    ps.sort(function (a, b) { return (mins[a.id] || 0) - (mins[b.id] || 0); });
    return '<h2 class="section-title">Playing time</h2><p class="meta">Least time first. Red means under half the team average.</p>' +
      '<div class="panel" style="padding:0">' + ps.map(function (p) {
        var on = L && !L.ended && keyOf(L.onField, p.id);
        var s = mins[p.id] || 0;
        return '<div class="time-row">' + jmini(p) + '<div><div class="nm">' + esc(p.name) + '</div><div class="st' + (on ? ' on' : '') + '">' +
               (on ? 'On field, ' + esc(POS_NAMES[labelFor(g.format, L.lines, on)]) : 'Bench') + '</div></div>' +
               '<div class="t" data-min="' + esc(p.id) + '">' + clock(s) + '</div>' +
               '<div class="bar"><i data-bar="' + esc(p.id) + '" class="' + (avg > 60 && s < avg / 2 ? 'low' : '') + '" style="width:' + Math.round(100 * s / max) + '%"></i></div></div>';
      }).join('') + '</div>';
  }

  function renderCard(t, g) {
    var cr = credits(t, g), base = credits(t, g, true);
    var ps = listedPlayers(t, g);
    var html = '<p class="lcard-note">Copy this onto the paper lineup card. The quarter boxes here show quarters NOT played, the same as the paper card.</p>';
    html += '<div class="lcard"><h2>Official lineup card</h2><dl>' +
      [['Region', t.region], ['Age group', t.ageGroup], ['Team #', t.teamNumber], ['Date', fmtDate(g.date, { month: 'numeric', day: 'numeric', year: 'numeric' })],
       ['Team name', t.name], ['Opposing team', g.opponent], ['Coach', t.coach], ['Asst. coach', t.asstCoach]].map(function (f) {
        return '<div><dt>' + f[0] + '</dt><dd>' + esc(f[1] || '') + '</dd></div>';
      }).join('') + '</dl>';
    html += '<table><thead><tr><th>No.</th><th>Player name</th><th>Goals</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr></thead><tbody>' +
      ps.map(function (p) {
        var a = att(g, p.id);
        var row = '<tr><td>' + esc(p.number) + '</td><td class="l">' + esc(p.name) + '</td><td>' + (g.goals[p.id] || '') + '</td>';
        if (a === 'absent') return row + '<td colspan="4" class="why">Absent' + (g.absentReason[p.id] ? ': ' + esc(g.absentReason[p.id]) : '') + '</td></tr>';
        for (var q = 0; q < 4; q++) row += '<td class="x">' + (a === 'sitout' || !cr[p.id][q] ? '✗' : '') + '</td>';
        return row + '</tr>';
      }).join('') + '</tbody></table>';
    if (ps.some(function (p) { return att(g, p.id) === 'sitout'; })) html += '<p style="margin:8px 0 0;font-size:13px">✗ on every quarter means the player sat out by request.</p>';
    html += '</div>';
    if (!t.region || !t.coach) html += '<p class="lcard-note">Fill in region, team number, and coach names under Roster, then Edit team.</p>';

    html += '<h2 class="section-title">Quarters played</h2><p class="meta">Filled boxes are quarters played. ' +
      (hasLiveData(g) ? 'They come from live tracking: a player gets credit for being on the field for at least half of the quarter.' : 'They come from your plan.') +
      ' Tap a box to fix it. Fixed boxes get a dotted outline.</p>';
    html += '<div class="tbl-wrap"><table class="grid"><thead><tr><th>#</th><th class="l">Player</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Goals</th></tr></thead><tbody>' +
      ps.filter(function (p) { return att(g, p.id) !== 'absent'; }).map(function (p) {
        var row = '<tr><td class="num">' + esc(p.number || '?') + '</td><td class="l">' + esc(p.name) + (att(g, p.id) === 'sitout' ? ' <small>(sat out)</small>' : '') + '</td>';
        for (var q = 0; q < 4; q++) {
          row += '<td><button data-action="toggle-q" data-id="' + esc(p.id) + '" data-q="' + q + '" class="hq1' + (cr[p.id][q] ? ' on' : '') + (cr[p.id][q] !== base[p.id][q] ? ' fixed' : '') +
                 '" aria-label="' + esc(p.name) + ', quarter ' + (q + 1) + ', ' + (cr[p.id][q] ? 'played' : 'not played') + '"></button></td>';
        }
        return row + '<td><span class="stepper"><button data-action="goal-minus" data-id="' + esc(p.id) + '" aria-label="Remove a goal">−</button>' +
               (g.goals[p.id] || 0) + '<button data-action="goal-plus" data-id="' + esc(p.id) + '" aria-label="Add a goal">+</button></span></td></tr>';
      }).join('') + '</tbody></table></div>';
    html += '<div class="row" style="margin-top:14px">' + (g.status === 'finished'
      ? '<button class="btn btn-quiet" data-action="reopen-game">Reopen game</button>'
      : '<button class="btn btn-primary" data-action="finish-game">Mark game finished</button>') + '</div>' +
      '<p class="meta">Only finished games count toward season playing time.</p>';
    return html;
  }

  // ---------- Practice: library, diagrams, plans ----------

  function findEntry(id) { return data.library.find(function (e) { return e.id === id; }) || null; }
  function entryFits(e, age) { return !e.ages.length || e.ages.indexOf(age) >= 0; }
  function typePill(type) { return '<span class="tpill ' + type + '">' + (type === 'break' ? 'Break' : ENTRY_TYPES[type]) + '</span>'; }
  function teamAges() {
    var a = [];
    data.teams.forEach(function (t) { if (a.indexOf(t.ageGroup) < 0) a.push(t.ageGroup); });
    return a.sort(function (x, y) { return AGE_GROUPS.indexOf(x) - AGE_GROUPS.indexOf(y); });
  }

  // Diagram drawing. Units: 100 wide, 100 tall (your half, or the attacking half when flipped).
  function diagramSVG(dg, team, editable) {
    var c = COLORS[team.color] || COLORS.blue;
    var s = '<svg class="pitch' + (editable ? ' edit' : '') + '"' + (editable ? ' id="dgEdit"' : '') + ' viewBox="0 0 100 100" role="img" aria-label="Play diagram">' +
      '<defs><marker id="ahP" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" fill="#fff"/></marker>' +
      '<marker id="ahR" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" fill="#FFD54A"/></marker></defs>' +
      halfPitch(dg.view === 'attack', true, !!dg.line);
    dg.arrows.forEach(function (a) {
      var sel = editable && dgSelected === a.id;
      var col = a.kind === 'pass' ? '#fff' : '#FFD54A';
      s += '<g class="dg-arrow" data-id="' + a.id + '">' +
           '<line x1="' + a.x1 + '" y1="' + a.y1 + '" x2="' + a.x2 + '" y2="' + a.y2 + '" stroke="transparent" stroke-width="5"/>' +
           '<line x1="' + a.x1 + '" y1="' + a.y1 + '" x2="' + a.x2 + '" y2="' + a.y2 + '" stroke="' + (sel ? '#F2B705' : col) + '" stroke-width="' + (sel ? 1.3 : .9) + '"' +
           (a.kind === 'run' ? ' stroke-dasharray="2 1.4"' : '') + ' marker-end="url(#' + (a.kind === 'pass' ? 'ahP' : 'ahR') + ')"/></g>';
    });
    dg.items.forEach(function (i) {
      s += '<g class="dg-item" data-id="' + i.id + '" transform="translate(' + i.x.toFixed(1) + ' ' + i.y.toFixed(1) + ')">';
      if (editable) s += '<circle r="6" fill="transparent"/>';
      if (editable && dgSelected === i.id) s += '<circle r="5.4" fill="none" stroke="#F2B705" stroke-width=".8" stroke-dasharray="1.6 1"/>';
      if (i.kind === 'us') s += '<circle r="3.6" fill="' + c.bg + '" stroke="#fff" stroke-width=".6"/><text y="1.4" text-anchor="middle" font-size="3.8" font-weight="800" fill="' + c.fg + '">' + esc(i.label) + '</text>';
      else if (i.kind === 'them') s += '<circle r="3.6" fill="#fff" stroke="#C62F2A" stroke-width=".9"/><text y="1.4" text-anchor="middle" font-size="3.8" font-weight="800" fill="#C62F2A">' + esc(i.label || 'X') + '</text>';
      else if (i.kind === 'ball') s += '<circle r="1.7" fill="#fff" stroke="#111" stroke-width=".45"/>';
      else s += '<path d="M0 -2.4 L2.1 1.7 L-2.1 1.7 Z" fill="#F28C28" stroke="#fff" stroke-width=".3"/>';
      s += '</g>';
    });
    if (editable && dgPending) s += '<circle cx="' + dgPending.x + '" cy="' + dgPending.y + '" r="1.4" fill="#F2B705"/>';
    return s + '</svg>';
  }
  var DG_TOOLS = [['move', 'Move'], ['us', 'Player'], ['them', 'Opponent'], ['ball', 'Ball'], ['cone', 'Cone'], ['pass', 'Pass'], ['run', 'Run']];
  var dgTool = 'us', dgSelected = null, dgPending = null, dgDrag = null;
  function dgHint() {
    if (dgTool === 'move') return dgSelected ? 'Drag to move it, or tap Delete.' : 'Tap something to select it. Drag to move it.';
    if (dgTool === 'pass' || dgTool === 'run') return dgPending ? 'Now tap where the arrow ends.' : 'Tap where the arrow starts.';
    return 'Tap the field to place it.';
  }
  function renderDiagramEditor(t) {
    var dg = entryDraft.diagram;
    if (!dg) return '<button class="btn btn-quiet" data-action="dg-add">Add a diagram</button>';
    return '<div class="dg-tools">' + DG_TOOLS.map(function (x) {
        return '<button class="dg-tool" data-action="dg-tool" data-tool="' + x[0] + '" aria-pressed="' + (dgTool === x[0]) + '">' + x[1] + '</button>';
      }).join('') + '<button class="dg-tool" data-action="dg-delete"' + (dgSelected ? '' : ' disabled') + '>Delete</button></div>' +
      '<div id="dgWrap">' + diagramSVG(dg, t, true) + '</div><p class="dg-hint" id="dgHint">' + dgHint() + '</p>' +
      '<div class="toolrow"><button class="btn btn-quiet" data-action="dg-view">' + (dg.view === 'attack' ? 'Show our goal' : 'Show their goal') + '</button>' +
      '<button class="btn btn-quiet" data-action="dg-line">' + (dg.line ? 'Hide build-out line' : 'Show build-out line') + '</button>' +
      '<button class="btn btn-quiet" data-action="dg-clear">Clear</button><button class="btn btn-danger" data-action="dg-remove">Remove diagram</button></div>';
  }
  function refreshDiagram() {
    var w = $('dgWrap');
    if (!w || !entryDraft || !entryDraft.diagram) return;
    w.innerHTML = diagramSVG(entryDraft.diagram, activeTeam(), true);
    $('dgHint').textContent = dgHint();
    document.querySelectorAll('.dg-tool').forEach(function (b) {
      if (b.dataset.tool) b.setAttribute('aria-pressed', String(dgTool === b.dataset.tool));
      if (b.dataset.action === 'dg-delete') b.disabled = !dgSelected;
    });
  }
  function svgPoint(svg, e) {
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: Math.round(Math.max(1, Math.min(99, p.x)) * 10) / 10, y: Math.round(Math.max(1, Math.min(99, p.y)) * 10) / 10 };
  }
  document.addEventListener('pointerdown', function (e) {
    var svg = e.target.closest && e.target.closest('#dgEdit');
    if (!svg || !entryDraft || !entryDraft.diagram) return;
    e.preventDefault();
    var dg = entryDraft.diagram, pt = svgPoint(svg, e);
    if (dgTool === 'move') {
      var it = e.target.closest('.dg-item'), ar = e.target.closest('.dg-arrow');
      if (it) {
        dgSelected = it.dataset.id;
        dgDrag = { id: it.dataset.id, moved: false };
        try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      } else dgSelected = ar ? ar.dataset.id : null;
      refreshDiagram();
      return;
    }
    if (dgTool === 'pass' || dgTool === 'run') {
      if (!dgPending) dgPending = pt;
      else {
        if (Math.abs(pt.x - dgPending.x) + Math.abs(pt.y - dgPending.y) > 2) {
          dg.arrows.push({ id: uid('a'), kind: dgTool, x1: dgPending.x, y1: dgPending.y, x2: pt.x, y2: pt.y });
        }
        dgPending = null;
      }
      refreshDiagram();
      return;
    }
    if (dg.items.length >= 60) { toast('That\'s the most a diagram can hold.'); return; }
    var label = '';
    if (dgTool === 'us') label = String(dg.items.filter(function (i) { return i.kind === 'us'; }).length + 1);
    dg.items.push({ id: uid('i'), kind: dgTool, x: pt.x, y: pt.y, label: label });
    refreshDiagram();
  });
  document.addEventListener('pointermove', function (e) {
    if (!dgDrag) return;
    var svg = $('dgEdit');
    if (!svg) return;
    var it = entryDraft.diagram.items.find(function (i) { return i.id === dgDrag.id; });
    if (!it) return;
    var pt = svgPoint(svg, e);
    it.x = pt.x; it.y = pt.y; dgDrag.moved = true;
    var g = svg.querySelector('.dg-item[data-id="' + it.id + '"]');
    if (g) g.setAttribute('transform', 'translate(' + it.x + ' ' + it.y + ')');
  });
  function endDrag() { if (dgDrag) { dgDrag = null; refreshDiagram(); } }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  // Library screens

  function entryBody(e, t) {

    if (e.video) html += '<h3>Video</h3><p><a href="' + esc(e.video) + '" target="_blank" rel="noopener">' + esc(e.video.replace(/^https?:\/\//, '')) + '</a></p>';

  }
  function renderEntryDetail(t) {
    var e = findEntry(entryId);
    if (!e) { entryId = null; return renderLibrary(); }
    var html = '<button class="back" data-action="entry-back">‹ Library</button>';
    html += '<div style="margin:8px 0 2px">' + typePill(e.type) + '</div><h1 class="game-title">' + esc(e.name) + '</h1>';
    html += entryBody(e, t);
    html += '<div class="toolrow" style="margin-top:18px"><button class="btn btn-primary" data-action="entry-edit">Edit</button>' +
            '<button class="btn btn-quiet" data-action="entry-to-practice">Add to a practice</button></div>' +
            '<div class="toolrow"><button class="btn btn-quiet" data-action="entry-copy">Make a copy</button>' +
            '<button class="btn btn-danger" data-action="entry-delete">Delete</button></div>';
    return html;
  }
  function renderEntryEdit(t) {
    var e = entryDraft;
    var ages = teamAges().concat(e.ages.filter(function (a) { return teamAges().indexOf(a) < 0; }));
    var html = '<button class="back" data-action="entry-cancel">‹ Cancel</button>';
    html += '<h1 class="game-title">' + (findEntry(e.id) ? 'Edit entry' : 'New entry') + '</h1>';
    html += '<section class="panel">' +
      '<label class="field"><span>Type</span><select data-ed="type">' + Object.keys(ENTRY_TYPES).map(function (k) {
        return '<option value="' + k + '"' + (e.type === k ? ' selected' : '') + '>' + ENTRY_TYPES[k] + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>Name</span><input data-ed="name" type="text" maxlength="80" value="' + esc(e.name) + '" placeholder="' +
        (e.type === 'setplay' ? 'For example: Corner kick, near post' : 'For example: Sharks and Minnows') + '"></label>' +
      '<label class="field"><span>Skill focus</span><input data-ed="focus" type="text" maxlength="80" value="' + esc(e.focus) + '" placeholder="Dribbling, passing, defending..."></label>' +
      '<div class="field"><span>Ages (none picked means all ages)</span><div class="filters">' + ages.map(function (a) {
        return '<button class="fchip" data-action="ed-age" data-age="' + a + '" aria-pressed="' + (e.ages.indexOf(a) >= 0) + '">' + a + '</button>'; }).join('') + '</div></div>' +
      '<div class="pair-even"><label class="field"><span>Minutes</span><input data-ed="minutes" type="number" inputmode="numeric" min="1" max="120" value="' + (e.minutes || '') + '"></label>' +
      '<label class="field"><span>Players</span><input data-ed="players" type="text" maxlength="80" value="' + esc(e.players) + '" placeholder="Whole team, pairs..."></label></div>' +
      '<label class="field"><span>Equipment</span><input data-ed="equipment" type="text" maxlength="300" value="' + esc(e.equipment) + '" placeholder="Cones, pinnies, a ball each"></label>' +
      '<label class="field"><span>Setup</span><textarea data-ed="setup" maxlength="2000" placeholder="Area size, where players start">' + esc(e.setup) + '</textarea></label>' +
      '<label class="field"><span>' + (e.type === 'setplay' ? 'How the play works' : 'How it works') + '</span><textarea data-ed="how" maxlength="4000">' + esc(e.how) + '</textarea></label>' +
      '<label class="field"><span>Coaching points</span><textarea data-ed="points" maxlength="3000" placeholder="What to watch for and praise">' + esc(e.points) + '</textarea></label>' +
      '<label class="field"><span>Video link (optional)</span><input data-ed="video" type="url" inputmode="url" maxlength="300" value="' + esc(e.video) + '" placeholder="https://"></label>' +
      '<label class="field"><span>Source (optional)</span><input data-ed="source" type="text" maxlength="120" value="' + esc(e.source) + '" placeholder="Where this came from"></label>' +
      '</section>';
    html += '<h2 class="section-title">Diagram</h2><p class="meta">Optional. Place players, the ball, and cones, then draw pass and run arrows. Especially useful for set plays.</p>';
    html += renderDiagramEditor(t);
    html += '<p class="error" id="entryError" role="alert"></p>';
    html += '<div class="toolrow"><button class="btn btn-primary" data-action="entry-save">Save</button><button class="btn btn-quiet" data-action="entry-cancel">Cancel</button></div>';
    return html;
  }

  // Practice plans
  function findPractice(team, id) { return team.practices.find(function (p) { return p.id === id; }) || null; }
  function itemName(it) {
    if (it.kind === 'break') return 'Water break';
    var e = findEntry(it.entryId);
    return e ? e.name : 'Deleted entry';
  }
  function practiceTotal(p) { return p.items.reduce(function (s, it) { return s + it.minutes; }, 0); }

  function renderPracticeList(t) {
    var html = '<div class="team-head"><div><h1>Practices</h1><p>' + esc(t.name) + ', ' + plural(t.practices.length, 'practice') + '</p></div>' +
               '<button class="btn btn-primary btn-small" data-action="practice-new">New practice</button></div>';
    if (!t.practices.length) {
      return html + '<div class="empty"><p>Plan a practice by stacking drills, fun games, and water breaks into a timed session. Then run it on the field with a countdown for each part.</p>' +
             '<button class="btn btn-primary" data-action="practice-new">New practice</button></div>';
    }
    var list = t.practices.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    return html + '<ul class="roster">' + list.map(function (p) {
      return '<li><button class="game-row" data-action="practice-open" data-id="' + esc(p.id) + '">' +
             '<span class="gdate">' + esc(fmtDate(p.date, { weekday: 'short' })) + '<b>' + esc(fmtDate(p.date, { month: 'short', day: 'numeric' })) + '</b></span>' +
             '<span class="gname">' + esc(p.title || 'Practice') + '<div class="sub" style="font-weight:400;color:var(--muted);font-size:14px">' +
             plural(p.items.length, 'part') + ', ' + practiceTotal(p) + ' of ' + p.length + ' min</div></span></button></li>';
    }).join('') + '</ul>';
  }

  function renderPracticeEdit(t, p) {
    var total = practiceTotal(p);
    var html = '<button class="back" data-action="practice-back">‹ All practices</button>';
    html += '<h1 class="game-title">' + esc(p.title || 'Practice') + '</h1><p class="game-sub">' + esc(fmtDate(p.date, { weekday: 'long', month: 'long', day: 'numeric' })) + '</p>';
    html += (p.items.length ? '<div class="toolrow" style="margin-top:0"><button class="btn btn-primary btn-sub" data-action="practice-run">' + (p.run ? 'Resume practice' : 'Run practice') + '</button></div>' : '');
    html += '<section class="panel"><label class="field"><span>Title</span><input data-pr="title" type="text" maxlength="60" value="' + esc(p.title) + '" placeholder="For example: Dribbling day"></label>' +
            '<div class="pair-even"><label class="field"><span>Date</span><input data-pr="date" type="date" value="' + esc(p.date) + '"></label>' +
            '<label class="field"><span>Length (minutes)</span><input data-pr="length" type="number" inputmode="numeric" min="10" max="240" value="' + p.length + '"></label></div></section>';
    html += '<h2 class="section-title">Plan</h2>';
    html += '<div class="totline"><span>Total</span><span class="' + (total > p.length ? 'over' : '') + '">' + total + ' of ' + p.length + ' min' + (total > p.length ? ', ' + (total - p.length) + ' over' : '') + '</span></div>';
    if (p.items.length) {
      html += '<div class="panel" style="padding:0">' + p.items.map(function (it, i) {
        var e = it.kind === 'entry' ? findEntry(it.entryId) : null;
        return '<div class="item-row"><div class="nm">' + (i + 1) + '. ' + esc(itemName(it)) + '</div>' + typePill(it.kind === 'break' ? 'break' : (e ? e.type : 'drill')) +
               '<div class="ctrls"><input type="number" inputmode="numeric" min="1" max="120" data-item-min="' + i + '" value="' + it.minutes + '" aria-label="Minutes for ' + esc(itemName(it)) + '"> min' +
               '<span style="flex:1"></span><button class="mini" data-action="item-up" data-i="' + i + '" aria-label="Move up"' + (i ? '' : ' disabled') + '>↑</button>' +
               '<button class="mini" data-action="item-down" data-i="' + i + '" aria-label="Move down"' + (i < p.items.length - 1 ? '' : ' disabled') + '>↓</button>' +
               '<button class="mini danger" data-action="item-remove" data-i="' + i + '" aria-label="Remove">✕</button></div></div>';
      }).join('') + '</div>';
    } else html += '<p class="meta">Nothing planned yet.</p>';
    html += '<div class="toolrow"><button class="btn btn-quiet" data-action="item-add">+ From library</button><button class="btn btn-quiet" data-action="item-break">+ Water break</button></div>';

    var players = sortedPlayers(t);
    var here = players.filter(function (pl) { return p.attendance[pl.id]; }).length;
    html += '<h2 class="section-title">Attendance</h2><p class="meta">' + here + ' of ' + players.length + ' here.</p>';
    html += players.length ? '<div class="panel" style="padding:0">' + players.map(function (pl) {
      return '<label class="check-row"><input type="checkbox" data-pat="' + esc(pl.id) + '"' + (p.attendance[pl.id] ? ' checked' : '') + '>' + jmini(pl) + '<span>' + esc(pl.name) + '</span></label>';
    }).join('') + '</div>' : '<p class="meta">Add players on the Roster tab.</p>';
    html += '<h2 class="section-title">Notes</h2><label class="field"><textarea data-pr="notes" maxlength="3000" placeholder="What went well, what to repeat next time" style="width:100%;min-height:100px;padding:12px;border:2px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:17px">' + esc(p.notes) + '</textarea></label>';
    html += '<div class="toolrow"><button class="btn btn-quiet" data-action="practice-copy">Copy to a new practice</button><button class="btn btn-danger" data-action="practice-delete">Delete practice</button></div>';
    return html;
  }

  function runElapsed(R) { return R.elapsedBefore + (R.running && R.startedAt ? (Date.now() - R.startedAt) / 1000 : 0); }
  function renderRun(t, p) {
    if (!p.run) p.run = { idx: 0, running: false, startedAt: null, elapsedBefore: 0 };
    var R = p.run, it = p.items[R.idx];
    if (!it) { R.idx = 0; it = p.items[0]; }
    var left = it.minutes * 60 - runElapsed(R);
    var next = p.items[R.idx + 1];
    var html = '<button class="back" data-action="run-exit">‹ Back to plan</button>';
    html += '<div class="run-head"><div class="run-step">Part ' + (R.idx + 1) + ' of ' + p.items.length + '</div>' +
            '<h2 class="run-name">' + esc(itemName(it)) + '</h2>' +
            '<div class="clock" id="runClock">' + (left < 0 ? '+' + clock(-left) : clock(left)) + '</div>' +
            '<div class="clock-meta' + (left < 0 ? ' over' : '') + '" id="runMeta">' + (left < 0 ? 'Time\'s up. Move on when ready.' : it.minutes + ' minutes') + '</div>' +
            '<div class="row">' + (R.running ? '<button class="btn btn-chalk" data-action="run-pause">Pause</button>' : '<button class="btn btn-chalk" data-action="run-start">' + (runElapsed(R) ? 'Resume' : 'Start') + '</button>') +
            '<button class="btn btn-outline-chalk" data-action="run-prev"' + (R.idx ? '' : ' disabled') + '>Back</button>' +
            '<button class="btn btn-outline-chalk" data-action="run-next">' + (next ? 'Next' : 'Finish') + '</button></div></div>';
    html += '<p class="next-up">' + (next ? 'Next up: ' + esc(itemName(next)) + ', ' + next.minutes + ' min' : 'This is the last part.') + '</p>';
    if (it.kind === 'entry') {
      var e = findEntry(it.entryId);
      html += e ? entryBody(e, t) : '<p class="meta">This entry was deleted from the library.</p>';
    } else html += '<p>Water, rest, and a quick word with the team.</p>';
    return html;
  }

  function renderPractice() {
    var t = activeTeam();
    if (entryEditing) return renderEntryEdit(t);
    if (entryId) return renderEntryDetail(t);
    var p = practiceId ? findPractice(t, practiceId) : null;
    if (practiceId && !p) practiceId = null;
    if (p && practiceRun && p.items.length) return renderRun(t, p);
    if (p) return renderPracticeEdit(t, p);
    var html = '<div class="seg two" style="margin-top:16px">' + [['plans', 'Practices'], ['library', 'Library']].map(function (x) {
      return '<button data-action="practice-tab" data-tab="' + x[0] + '" aria-current="' + (practiceTab === x[0]) + '">' + x[1] + '</button>';
    }).join('') + '</div>';
    return html + (practiceTab === 'library' ? renderLibrary() : renderPracticeList(t));
  }

  // ---------- Rendering: shared shell ----------

  function applyTeamColor() {
    var c = COLORS[activeTeam().color] || COLORS.blue;
    document.documentElement.style.setProperty('--team-bg', c.bg);
    document.documentElement.style.setProperty('--team-fg', c.fg);
  }
  function renderTabs() {
    var html = data.teams.map(function (t) {
      var c = COLORS[t.color] || COLORS.blue;
      return '<button class="team-tab" data-action="switch-team" data-id="' + esc(t.id) + '" aria-current="' + (t.id === data.activeTeamId) + '">' +
             '<span class="dot" style="background:' + c.bg + '"></span>' + esc(t.name) + '</button>';
    }).join('');
    html += '<button class="team-tab add" data-action="add-team" aria-label="Add a team">+ Team</button>';
    $('teamTabs').innerHTML = html;
  }

  function renderRoster() {
    var t = activeTeam();
    var players = sortedPlayers(t);
    var counts = {};
    players.forEach(function (p) { if (p.number !== '') counts[p.number] = (counts[p.number] || 0) + 1; });
    var html = '';
    if (needsBackup()) {
      html += '<div class="nudge"><span>You have changes that aren\'t backed up.</span>' +
              '<button class="btn" data-action="export">Back up now</button></div>';
    }
    html += '<div class="team-head"><div><h1>' + esc(t.name) + '</h1><p>' + esc(t.ageGroup) + ', ' + plural(players.length, 'player') + '</p></div>' +
            '<button class="btn btn-quiet btn-small" data-action="edit-team">Edit team</button></div>';
    if (!players.length) {
      html += '<div class="empty"><p>No players on this roster yet. Add your first player to start the ' + esc(t.name) + ' roster.</p>' +
              '<button class="btn btn-primary" data-action="add-player">Add player</button></div>';
    } else {
      html += '<ul class="roster">' + players.map(function (p) {
        var dup = p.number !== '' && counts[p.number] > 1;
        var sub = dup ? '<div class="dup">Another player also wears #' + esc(p.number) + '</div>'
                      : (p.notes ? '<div class="pnotes">' + esc(p.notes) + '</div>' : '');
        return '<li><button class="player" data-action="edit-player" data-id="' + esc(p.id) + '">' +
               '<span class="jersey-wrap"><span class="jersey' + (p.number === '' ? ' blank' : '') + '">' + (p.number === '' ? '?' : esc(p.number)) + '</span></span>' +
               '<span class="pinfo"><div class="pname">' + esc(p.name) + '</div>' + sub + '</span></button></li>';
      }).join('') + '</ul>';
    }
    return html;
  }

  function renderSoon(title, phase, text) {
    return '<div class="soon"><h1 class="page-title">' + title + '</h1><span class="phase">Coming in phase ' + phase + '</span><p>' + text + '</p></div>';
  }
  function renderMore() {
    var html = '<h1 class="page-title">More</h1>';
    html += '<section class="panel"><h2>Backup</h2>' +
            '<p>Your rosters, games, lineups, practices, and library are stored only on this device. Save a backup file after you make changes, and keep it somewhere safe, like the Files app, Google Drive, or an email to yourself.</p>' +
            '<p class="meta">Last backup: ' + lastBackupText() + '</p>' +
            '<div class="row"><button class="btn btn-primary" data-action="export">Save backup file</button>' +
            '<button class="btn btn-quiet" data-action="import">Restore from backup</button></div></section>';
    html += '<section class="panel"><h2>Install on your phone</h2>';
    if (isInstalled()) html += '<p>Installed. You are using the home screen app, and it works without a signal.</p>';
    else {
      html += '<p>Install the app so it opens from your home screen and works at fields with no signal.</p>';
      if (isIOS()) html += '<p class="warn">On iPhone, the home screen app keeps its own separate data from Safari. Install first, then enter your rosters in the installed app.</p>';
      html += '<h3>iPhone (Safari)</h3><ol><li>Tap the Share button (the square with an arrow).</li>' +
              '<li>Scroll down and tap <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li></ol>' +
              '<h3>Android (Chrome)</h3><ol><li>Tap the three-dot menu in the top corner.</li>' +
              '<li>Tap <strong>Add to Home screen</strong> or <strong>Install app</strong>.</li><li>Tap <strong>Install</strong>.</li></ol>';
    }
    html += '</section>';
    html += '<section class="panel"><h2>Storage</h2><p id="persistStatus" class="meta">' +
            (storageOk ? 'Checking...' : 'This browser is blocking storage, so nothing will be saved. Private browsing mode is the usual cause.') + '</p></section>';
    html += '<p class="version">Soccer Coach ' + APP_VERSION + ', phase 3</p>';
    return html;
  }
  function updatePersistStatus() {
    var el = $('persistStatus');
    if (!el || !storageOk) return;
    if (!navigator.storage || !navigator.storage.persisted) {
      el.textContent = 'This browser may clear app data if the app goes unused for a while. Backups are your safety net.';
      return;
    }
    navigator.storage.persisted().then(function (yes) {
      el.textContent = yes
        ? 'Protected. This browser has agreed not to clear the app\'s data on its own. Keep making backups anyway.'
        : 'Not protected yet. The browser may clear data from apps that go unused for a while. Installing the app helps, and backups are your safety net.';
    }).catch(function () {});
  }

  function currentGame() { return gameId && activeTeam() ? findGame(activeTeam(), gameId) : null; }
  function currentPractice() { return practiceId && activeTeam() ? findPractice(activeTeam(), practiceId) : null; }

  var welcomePick = [];
  function renderWelcome() {
    var html = '<div style="padding-top:20px"><h1 class="page-title" style="margin-bottom:6px">Welcome, coach</h1>' +
      '<p class="meta" style="margin-top:0">Which age groups are you coaching? Pick one or more. Each one becomes a team with the right game size and formation, and you can change any of it later.</p></div>';
    html += '<div class="panel" style="padding:0">' + AGE_GROUPS.map(function (a) {
      var d = defaultsFor(a), on = welcomePick.indexOf(a) >= 0;
      return '<label class="check-row"><input type="checkbox" data-welcome="' + a + '"' + (on ? ' checked' : '') + '>' +
             '<span><b style="font:800 20px/1 var(--cond);font-stretch:condensed">' + ageLabel(a) + '</b><br><span class="meta">' + FMT(d.format).label + ', ' +
             formName(d.format, FMT(d.format).def) + '. ' + d.quarterMin + '-minute quarters, size ' + d.ball + ' ball.</span></span></label>';
    }).join('') + '</div>';
    html += '<div class="toolrow"><button class="btn btn-primary btn-sub" data-action="welcome-go"' + (welcomePick.length ? '' : ' disabled') + '>' +
            (welcomePick.length ? 'Create ' + plural(welcomePick.length, 'team') : 'Pick at least one age group') + '</button></div>';
    html += '<p class="meta">Moving from another phone? <button class="back" style="margin:0;padding:0" data-action="import">Restore a backup file</button></p>';
    html += '<p class="meta">Age groups, players on the field, ball sizes, and quarter lengths follow your region\'s charts. Adjust anything later under Roster, then Edit team.</p>';
    return html;
  }

  function render() {
    if (!data.teams.length) {
      $('main').innerHTML = renderWelcome();
      $('teamTabs').style.display = 'none';
      $('fab').hidden = true;
      document.querySelector('.tabbar').hidden = true;
      return;
    }
    document.querySelector('.tabbar').hidden = false;
    applyTeamColor();
    renderTabs();
    var t = activeTeam();
    var g = view === 'game' ? currentGame() : null;
    if (view === 'game' && gameId && !g) gameId = null;
    var html, showTabs = false;
    if (view === 'roster') { html = renderRoster(); showTabs = true; }
    else if (view === 'game') {
      if (g) html = renderGame(t, g);
      else if (gamePage === 'lineup' && lineupDraft) html = renderLineupEdit(t);
      else if (gamePage === 'lineups') { html = renderLineupList(t); showTabs = true; }
      else { html = renderGameList(); showTabs = true; }
    }
    else if (view === 'practice') {
      html = renderPractice();
      showTabs = !entryEditing && !entryId && !practiceId && practiceTab === 'plans';
    }
    else if (view === 'rules') html = renderSoon('Rules', 4, 'Plain-language rules of the game, your region\'s small-sided rules, positions explained, and your own saved manuals.');
    else html = renderMore();
    $('main').innerHTML = html;
    $('fab').hidden = view !== 'roster' || t.players.length === 0;
    document.querySelectorAll('.tab').forEach(function (b) {
      if (b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('teamTabs').style.display = showTabs ? '' : 'none';
    if (view === 'more') updatePersistStatus();
    manageWakeLock();
  }

  // ---------- Clocks and screen wake ----------

  function tick() {
    var t = activeTeam();
    if (!t) return;
    if (view === 'practice' && practiceRun) {
      var p = currentPractice();
      if (!p || !p.run || !p.items[p.run.idx]) return;
      var left = p.items[p.run.idx].minutes * 60 - runElapsed(p.run);
      var rc = $('runClock'), rm = $('runMeta');
      if (rc) rc.textContent = left < 0 ? '+' + clock(-left) : clock(left);
      if (rm) { rm.textContent = left < 0 ? 'Time\'s up. Move on when ready.' : p.items[p.run.idx].minutes + ' minutes'; rm.classList.toggle('over', left < 0); }
      return;
    }
    if (view !== 'game' || gameTab !== 'live') return;
    var g = currentGame();
    if (!g || !g.live || g.live.ended) return;
    var L = g.live, e = elapsed(L), Q = g.quarterMin * 60;
    var c = $('liveClock'), m = $('liveMeta');
    if (!L.qStarted && L.breakAt) {
      var left = breakLeft(L);
      if (c) c.textContent = clock(Math.max(0, left));
      if (m) { m.textContent = breakMeta(L); m.classList.toggle('over', left <= 0); }
      if (left <= 0 && breakAlerted !== L.breakAt) {
        breakAlerted = L.breakAt;
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        toast(breakName(L) + ' is over. Start quarter ' + (L.q + 1) + ' at the whistle.');
      }
      return;
    }
    if (c) c.textContent = clock(e);
    if (m) { m.textContent = e >= Q ? 'Time\'s up. End the quarter at the whistle.' : 'of ' + clock(Q); m.classList.toggle('over', e >= Q); }
    if (!L.running) return;
    var mins = minutesFor(t, g);
    var ps = playingPlayers(t, g);
    var max = Math.max(60, Math.max.apply(null, ps.map(function (p) { return mins[p.id] || 0; })));
    var avg = ps.length ? ps.reduce(function (s, p) { return s + (mins[p.id] || 0); }, 0) / ps.length : 0;
    ps.forEach(function (p) {
      var el = document.querySelector('[data-min="' + p.id + '"]'); if (el) el.textContent = clock(mins[p.id] || 0);
      var bar = document.querySelector('[data-bar="' + p.id + '"]');
      if (bar) { bar.style.width = Math.round(100 * (mins[p.id] || 0) / max) + '%'; bar.classList.toggle('low', avg > 60 && (mins[p.id] || 0) < avg / 2); }
    });
  }
  var breakAlerted = null;
  setInterval(tick, 1000);

  var wakeLock = null;
  function manageWakeLock() {
    if (!activeTeam()) return;
    var g = view === 'game' && gameTab === 'live' ? currentGame() : null;
    var want = !!(g && g.live && !g.live.ended) || (view === 'practice' && practiceRun);
    if (want && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;

      if (a === 'lineup-save') {
        lineupDraft.name = (lineupDraft.name || '').trim();
        if (!lineupDraft.name) { toast('Give the lineup a name first.'); var ni = document.querySelector('[data-ld="name"]'); if (ni) ni.focus(); return; }
        var clean = normalizeLineup(lineupDraft);
        var idx = t.lineups.findIndex(function (l) { return l.id === clean.id; });
        if (idx >= 0) t.lineups[idx] = clean; else t.lineups.push(clean);
        commit(); lineupDraft = null; gamePage = 'lineups'; render(); toast('Saved ' + clean.name); return;
      }
      if (a === 'lineup-copy') {
        var cp = normalizeLineup(Object.assign({}, lineupDraft, { id: uid('l'), name: (lineupDraft.name + ' copy').slice(0, 40) }));
        t.lineups.push(cp); commit(); lineupDraft = JSON.parse(JSON.stringify(cp)); render(); toast('Copy made. You\'re editing the copy.'); return;
      }
      if (a === 'lineup-delete') {
        if (!confirm('Delete the lineup "' + lineupDraft.name + '"? Games that already used it keep their players.')) return;
        t.lineups = t.lineups.filter(function (l) { return l.id !== lineupDraft.id; });
        commit(); lineupDraft = null; gamePage = 'lineups'; render(); toast('Lineup deleted'); return;
      }
    }

    // Practice and library
    if (a === 'practice-tab') { practiceTab = el.dataset.tab; render(); return; }
    if (a === 'practice-new') {
      var np = normalizePractice({ date: today(), length: 60 });
      t.practices.push(np); practiceId = np.id; practiceRun = false;
      commit(); render(); window.scrollTo(0, 0); return;
    }
    if (a === 'practice-open') { practiceId = el.dataset.id; practiceRun = false; render(); window.scrollTo(0, 0); return; }
    if (a === 'practice-back') { practiceId = null; render(); window.scrollTo(0, 0); return; }
    if (a === 'lib-filter') { libFilter = el.dataset.f; render(); return; }
    if (a === 'lib-import') return $('libImport').click();
    if (a === 'entry-new') {
      entryDraft = normalizeEntry({ type: libFilter === 'all' ? 'drill' : libFilter, name: '' });
      entryDraft.name = ''; entryDraft.ages = [];
      entryEditing = true; dgSelected = null; dgPending = null; dgTool = 'us';
      render(); window.scrollTo(0, 0); return;
    }
    if (a === 'entry-open') { entryId = el.dataset.id; render(); window.scrollTo(0, 0); return; }
    if (a === 'entry-back') { entryId = null; render(); return; }
    if (a === 'entry-edit') {
      var ee = findEntry(entryId);
      if (ee) { entryDraft = JSON.parse(JSON.stringify(ee)); entryEditing = true; dgSelected = null; dgPending = null; dgTool = 'move'; render(); window.scrollTo(0, 0); }
      return;
    }
    if (a === 'entry-cancel') { entryEditing = false; entryDraft = null; render(); return; }
    if (entryEditing && entryDraft) {
      if (a === 'ed-age') {
        var age = el.dataset.age, ai = entryDraft.ages.indexOf(age);
        if (ai >= 0) entryDraft.ages.splice(ai, 1); else entryDraft.ages.push(age);
        el.setAttribute('aria-pressed', String(ai < 0)); return;
      }
      if (a === 'dg-add') {
        entryDraft.diagram = { view: entryDraft.type === 'setplay' ? 'attack' : 'defend', line: !!(t && t.buildOut), items: [], arrows: [] };
        dgTool = 'us'; render(); return;
      }
      if (a === 'dg-tool') { dgTool = el.dataset.tool; dgPending = null; if (dgTool !== 'move') dgSelected = null; refreshDiagram(); return; }
      if (a === 'dg-delete') {
        var d = entryDraft.diagram;
        d.items = d.items.filter(function (i) { return i.id !== dgSelected; });
        d.arrows = d.arrows.filter(function (x) { return x.id !== dgSelected; });
        dgSelected = null; refreshDiagram(); return;
      }
      if (a === 'dg-line') { entryDraft.diagram.line = !entryDraft.diagram.line; render(); return; }
      if (a === 'dg-view') { entryDraft.diagram.view = entryDraft.diagram.view === 'attack' ? 'defend' : 'attack'; render(); return; }
      if (a === 'dg-clear') { if (confirm('Clear everything from the diagram?')) { entryDraft.diagram.items = []; entryDraft.diagram.arrows = []; dgSelected = null; refreshDiagram(); } return; }
      if (a === 'dg-remove') { if (confirm('Remove the diagram?')) { entryDraft.diagram = null; render(); } return; }
      if (a === 'entry-save') {
        if (!String(entryDraft.name || '').trim()) { $('entryError').textContent = 'Give it a name.'; var nm = document.querySelector('[data-ed="name"]'); if (nm) nm.focus(); return; }
        var clean = normalizeEntry(entryDraft);
        var ix = data.library.findIndex(function (x) { return x.id === clean.id; });
        if (ix >= 0) data.library[ix] = clean; else data.library.push(clean);
        commit(); entryEditing = false; entryDraft = null; entryId = clean.id; render(); window.scrollTo(0, 0); toast('Saved ' + clean.name); return;
      }
    }
    if (entryId && !entryEditing) {
      var en = findEntry(entryId);
      if (a === 'entry-copy' && en) {
        var c2 = normalizeEntry(JSON.parse(JSON.stringify(en)));
        c2.id = uid('e'); c2.name = (en.name + ' copy').slice(0, 80);
        data.library.push(c2); commit(); entryId = c2.id; render(); toast('Copy made'); return;
      }
      if (a === 'entry-delete' && en) {
        if (!confirm('Delete "' + en.name + '" from the library? Practices that use it will show it as deleted.')) return;
        data.library = data.library.filter(function (x) { return x.id !== en.id; });
        commit(); entryId = null; render(); toast('Deleted'); return;
      }
      if (a === 'entry-to-practice' && en) {
        var list = t.practices.slice().sort(function (x, y) { return y.date.localeCompare(x.date); });
        var opts = [{ label: 'New practice', detail: t.name, value: '__new' }].concat(list.map(function (pr) {
          return { label: pr.title || 'Practice', detail: fmtDate(pr.date) + ', ' + practiceTotal(pr) + ' min', value: pr.id };
        }));
        return openPicker('Add to which practice?', t.name, opts, function (pid) {
          var target = pid === '__new' ? normalizePractice({ date: today(), length: 60 }) : findPractice(t, pid);
          if (pid === '__new') t.practices.push(target);
          target.items.push({ id: uid('it'), kind: 'entry', entryId: en.id, minutes: en.minutes || 10, note: '' });
          commit(); toast('Added to ' + (target.title || 'practice on ' + fmtDate(target.date)));
        });
      }
    }
    if (p) {
      if (a === 'practice-run') { if (!p.run) p.run = { idx: 0, running: false, startedAt: null, elapsedBefore: 0 }; practiceRun = true; commit(); render(); window.scrollTo(0, 0); return; }
      if (a === 'run-exit') { practiceRun = false; render(); return; }
      var R = p.run;
      if (R && a === 'run-start') { R.running = true; R.startedAt = Date.now(); commit(); render(); return; }
      if (R && a === 'run-pause') { R.elapsedBefore = runElapsed(R); R.running = false; R.startedAt = null; commit(); render(); return; }
      if (R && (a === 'run-next' || a === 'run-prev')) {
        var was = R.running;
        if (a === 'run-next' && R.idx >= p.items.length - 1) {
          p.run = null; practiceRun = false; commit(); render(); window.scrollTo(0, 0); toast('Practice finished. Add notes while they\'re fresh.'); return;
        }
        R.idx = Math.max(0, Math.min(p.items.length - 1, R.idx + (a === 'run-next' ? 1 : -1)));
        R.elapsedBefore = 0; R.running = was; R.startedAt = was ? Date.now() : null;
        commit(); render(); window.scrollTo(0, 0); return;
      }
      if (a === 'item-add') {
        var fits = data.library.filter(function (x) { return entryFits(x, t.ageGroup); }).sort(function (x, y) { return x.type.localeCompare(y.type) || x.name.localeCompare(y.name); });
        if (!data.library.length) { toast('Your library is empty. Add entries under Practice, then Library.'); return; }
        return openPicker('Add from library', 'Showing entries for ' + t.ageGroup + '.', fits.map(function (x) {
          return { label: x.name, detail: x.minutes ? x.minutes + ' min' : '', pill: x.type, value: x.id };
        }), function (eid) {
          var x = findEntry(eid);
          p.items.push({ id: uid('it'), kind: 'entry', entryId: eid, minutes: (x && x.minutes) || 10, note: '' });
          commit(); render();
        });
      }
      if (a === 'item-break') { p.items.push({ id: uid('it'), kind: 'break', entryId: '', minutes: 3, note: '' }); commit(); render(); return; }
      var i = +el.dataset.i;
      if (a === 'item-up' && i > 0) { p.items.splice(i - 1, 0, p.items.splice(i, 1)[0]); commit(); render(); return; }
      if (a === 'item-down' && i < p.items.length - 1) { p.items.splice(i + 1, 0, p.items.splice(i, 1)[0]); commit(); render(); return; }
      if (a === 'item-remove') { p.items.splice(i, 1); if (p.run) p.run = null; commit(); render(); return; }
      if (a === 'practice-copy') {
        var cp2 = normalizePractice(JSON.parse(JSON.stringify(p)));
        cp2.id = uid('pr'); cp2.date = today(); cp2.attendance = {}; cp2.notes = ''; cp2.run = null;
        cp2.items.forEach(function (x) { x.id = uid('it'); });
        t.practices.push(cp2); practiceId = cp2.id; commit(); render(); window.scrollTo(0, 0); toast('Copied. Set the new date.'); return;
      }
      if (a === 'practice-delete') {
        if (!confirm('Delete this practice plan?')) return;
        t.practices = t.practices.filter(function (x) { return x.id !== p.id; });
        practiceId = null; commit(); render(); toast('Practice deleted'); return;
      }
    }

    // Inside one game
    if (!g) return;
    if (a === 'game-tab') { gameTab = el.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (a === 'delete-game') {
      if (!confirm('Delete the game vs ' + (g.opponent || 'opponent not set') + '? Its plan and playing-time record will be gone.')) return;
      t.games = t.games.filter(function (x) { return x.id !== g.id; });
      gameId = null; commit(); render(); toast('Game deleted'); return;
    }
    if (a === 'reset-live') {
      if (!confirm('Clear the live clock, subs, and times for this game? Your plan stays.')) return;
      g.live = null; g.status = 'planned'; commit(); render(); return;
    }
    if (a === 'game-formation') {
      return pickFormation(g.format, g.lines, function (lines) {
        g.lines = lines;
        g.plan.forEach(function (q) { if (!Object.keys(q.slots).length) q.lines = lines.slice(); });
        commit(); render();
      });
    }
    // Plan
    var pq = g.plan[planQ];
    if (a === 'plan-q') { planQ = +el.dataset.q; render(); return; }
    if (a === 'plan-formation') {
      return pickFormation(g.format, pq.lines, function (lines) {
        pq.lines = lines; pq.slots = remapSlots(g.format, lines, pq.slots); pq.name = ''; commit(); render();
      });
    }
    if (a === 'plan-use-lineup') {
      var lopts = lineupOptions(t, g);
      if (!lopts.length) { toast('No saved lineups for ' + FMT(g.format).label + ' yet. Make one under Games, then Saved lineups.'); return; }
      return openPicker('Use a saved lineup', 'For quarter ' + (planQ + 1) + '. Kids not here today leave an empty spot.', lopts, function (lid) {
        var l = findLineup(t, lid);
        pq.lines = l.lines.slice(); pq.name = l.name; pq.slots = usableSlots(t, g, g.format, l.lines, l.slots);
        commit(); render();
        var gap = FMT(g.format).size - Object.keys(pq.slots).length;
        toast('Using ' + l.name + (gap > 0 ? '. ' + plural(gap, 'spot') + ' to fill.' : ''));
      });
    }
    if (a === 'plan-pos') {
      var counts = plannedCounts(t, g), ppos = el.dataset.pos;
      return pickForSpot(t, POS_NAMES[labelFor(g.format, pq.lines, ppos)], 'Quarter ' + (planQ + 1), pq.slots, ppos, playingPlayers(t, g).sort(function (x, y) { return counts[x.id] - counts[y.id]; }),
        function (pl, at) { return at ? 'Swap from ' + labelFor(g.format, pq.lines, at) : plural(counts[pl.id], 'quarter') + ' planned'; }, 'Leave this spot empty',
        function (pid) { setSpot(pq.slots, ppos, pid); pq.name = ''; commit(); render(); });
    }
    if (a === 'bench-plan') {
      var bp = playerById(t, el.dataset.id);
      return openPicker('Put ' + bp.name + ' in', 'Quarter ' + (planQ + 1), positionsFor(g.format, pq.lines).map(function (ps) {
        var cur = pq.slots[ps.key] ? playerById(t, pq.slots[ps.key]) : null;
        return { label: POS_NAMES[ps.label], detail: cur ? 'Replaces ' + firstName(cur.name) : 'Empty', value: ps.key };
      }), function (key) { pq.slots[key] = bp.id; pq.name = ''; commit(); render(); });
    }
    if (a === 'suggest') {
      var has = g.plan.some(function (q) { return Object.keys(q.slots).length; });
      if (has && !confirm('Replace your plan for all four quarters with a new suggestion?')) return;
      suggestAttempt++;
      g.plan = suggestPlan(t, g, suggestAttempt);
      planQ = 0; commit(); render(); toast('Rotation suggested. Adjust it however you like.'); return;
    }
    if (a === 'copy-prev') { var pr = g.plan[planQ - 1]; g.plan[planQ] = { name: pr.name, lines: pr.lines.slice(), slots: Object.assign({}, pr.slots) }; commit(); render(); return; }
    if (a === 'clear-q') { g.plan[planQ] = emptyQuarter(pq.lines); commit(); render(); return; }
    if (a === 'save-as-lineup') {
      if (!Object.keys(pq.slots).length) { toast('Put some players on the field first.'); return; }
      var lname = prompt('Name this lineup', pq.name || 'Lineup ' + (t.lineups.length + 1));
      if (lname == null) return;
      lname = lname.trim().slice(0, 40) || 'Lineup ' + (t.lineups.length + 1);
      t.lineups.push(normalizeLineup({ name: lname, format: g.format, lines: pq.lines, slots: pq.slots }));
      pq.name = lname; commit(); render(); toast('Saved lineup ' + lname); return;
    }
    var L = g.live;
    // Card
    if (a === 'toggle-q') {
      var tp = el.dataset.id, q = +el.dataset.q;
      var base = credits(t, g, true)[tp][q], curv = credits(t, g)[tp][q];
      g.qOverrides[tp] = g.qOverrides[tp] || {};
      if (!curv === base) delete g.qOverrides[tp][q]; else g.qOverrides[tp][q] = !curv;
      commit(); render(); return;
    }
    if (a === 'goal-plus') { g.goals[el.dataset.id] = (g.goals[el.dataset.id] || 0) + 1; commit(); render(); return; }
    if (a === 'goal-minus') { g.goals[el.dataset.id] = Math.max(0, (g.goals[el.dataset.id] || 0) - 1); commit(); render(); return; }
    if (a === 'finish-game') {
      if (L && !L.ended && L.qStarted && !confirm('Live tracking is still running. Finish the game anyway?')) return;
      if (L && L.qStarted) {
        var e3 = elapsed(L);
        L.stints.forEach(function (s) { if (s.to == null) s.to = e3; });
        L.qDur[L.q] = e3; L.running = false; L.qStarted = false;
      }
      if (L) L.ended = true;
      g.status = 'finished'; commit(); render(); toast('Game finished'); return;
    }
    if (a === 'reopen-game') { g.status = L && !L.ended ? 'live' : 'planned'; commit(); render(); }
    // Live
    if (a === 'live-begin') {
      var first = g.plan[0];
      g.live = normalizeLive({ lines: first.lines, onField: usableSlots(t, g, g.format, first.lines, first.slots) }, g.format, first.lines, null);
      g.status = 'live'; commit(); render(); return;
    }
    if (!L) return;
    if (a === 'live-start') {
      L.qStarted = true; L.running = true; L.startedAt = Date.now(); L.elapsedBefore = 0; L.history = []; L.breakAt = null;
      Object.keys(L.onField).forEach(function (k) { openStint(L, L.onField[k], k, 0); });
      commit(); render(); return;
    }
    if (a === 'live-skip-break') { L.breakAt = null; commit(); render(); return; }
    if (a === 'live-pause') { L.elapsedBefore = elapsed(L); L.running = false; L.startedAt = null; commit(); render(); return; }
    if (a === 'live-resume') { L.running = true; L.startedAt = Date.now(); commit(); render(); return; }
    if (a === 'live-end') {
      if (!confirm('End quarter ' + (L.q + 1) + ' at ' + clock(elapsed(L)) + '?')) return;
      var e2 = elapsed(L);
      L.stints.forEach(function (s) { if (s.q === L.q && s.to == null) s.to = e2; });
      L.qDur[L.q] = e2;
      L.running = false; L.startedAt = null; L.elapsedBefore = 0; L.qStarted = false; L.history = [];
      if (L.q >= 3) {
        L.ended = true; L.q = 4; g.status = 'finished';
        commit(); gameTab = 'card'; render(); window.scrollTo(0, 0); toast('Game finished. Here is your lineup card.');
        return;
      }
      L.q++;
      L.breakAt = Date.now();
      L.breakLen = L.q === 2 ? HALFTIME : WATER_BREAK;
      var nq = g.plan[L.q], next = usableSlots(t, g, g.format, nq.lines, nq.slots);
      if (Object.keys(next).length) { L.onField = next; L.lines = nq.lines.slice(); }
      commit(); render(); window.scrollTo(0, 0); return;
    }
    if (a === 'live-use-plan') {
      var cq = g.plan[L.q];
      liveApplyLineup(L, cq.lines, usableSlots(t, g, g.format, cq.lines, cq.slots));
      commit(); render(); toast('Planned lineup loaded'); return;
    }
    if (a === 'live-sub') return startSub(t, g);
    if (a === 'live-change-lineup') {
      var copts = lineupOptions(t, g);
      var pl2 = g.plan[L.q];
      if (Object.keys(pl2.slots).length) copts.unshift({ label: 'Quarter ' + (L.q + 1) + ' plan', detail: formName(g.format, pl2.lines), value: '__plan' });
      if (!copts.length) { toast('No saved lineups for ' + FMT(g.format).label + ' yet.'); return; }
      return openPicker('Change lineup', L.qStarted ? 'Every swap happens at once and minutes keep counting correctly.' : null, copts, function (lid) {
        var src = lid === '__plan' ? pl2 : findLineup(t, lid);
        var slots = usableSlots(t, g, g.format, src.lines, src.slots);
        liveApplyLineup(L, src.lines, slots);
        commit(); render();
        var gap = FMT(g.format).size - Object.keys(slots).length;
        toast((lid === '__plan' ? 'Planned lineup' : src.name) + ' is on' + (gap > 0 ? '. ' + plural(gap, 'spot') + ' to fill.' : ''));
      });
    }
    if (a === 'live-pos') {
      var lpos = el.dataset.pos, mins = minutesFor(t, g);
      var cur = L.onField[lpos] ? playerById(t, L.onField[lpos]) : null;
      return pickForSpot(t, cur ? 'Sub for ' + jerseyText(cur) + cur.name : 'Fill ' + POS_NAMES[labelFor(g.format, L.lines, lpos)],
        POS_NAMES[labelFor(g.format, L.lines, lpos)] + (L.qStarted ? '. Mid-quarter subs only when your team has the ball.' : ''),
        L.onField, lpos, playingPlayers(t, g).sort(function (x, y) { return (mins[x.id] || 0) - (mins[y.id] || 0); }),
        function (pl, at) { return at ? 'Swap from ' + labelFor(g.format, L.lines, at) : clock(mins[pl.id] || 0) + ' played'; }, 'Take off with no replacement',
        function (pid) { liveAssign(L, lpos, pid); commit(); render(); });
    }
    if (a === 'live-undo') {
      var snap = L.history.pop();
      if (snap) { var s = JSON.parse(snap); L.onField = s.onField; L.stints = s.stints; if (s.lines) L.lines = s.lines; commit(); render(); toast('Last change undone'); }
      return;
    }
    if (a === 'live-goal') {
      var on = playingPlayers(t, g).filter(function (x) { return keyOf(L.onField, x.id); });
      var off = playingPlayers(t, g).filter(function (x) { return !keyOf(L.onField, x.id); });
      return openPicker('Who scored?', null, on.concat(off).map(function (x) {
        return { label: x.name, detail: (g.goals[x.id] || 0) + ' so far', player: x, value: x.id };
      }), function (pid) { g.goals[pid] = (g.goals[pid] || 0) + 1; commit(); render(); toast('Goal for ' + playerById(t, pid).name); });
    }
  });

  // ---------- Offline support and updates ----------

  var waitingWorker = null, updateRequested = false;
  function showUpdate(worker) { waitingWorker = worker; $('updateBanner').hidden = false; }
  function applyUpdate() {
    updateRequested = true;
    if (waitingWorker) waitingWorker.postMessage('skipWaiting'); else location.reload();
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', function () {
            if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
          });
        });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update().catch(function () {});
        });
      }).catch(function (err) { console.warn('Offline support unavailable:', err); });
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (updateRequested) location.reload(); });
    });
  }

  render();
})();

</script>
</body>
</html>
