<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Soccer Coach</title>
<style>
:root {
  --turf: #1E5B38;
  --turf-deep: #154129;
  --chalk: #FFFFFF;
  --wash: #E8EEE6;
  --surface: #FFFFFF;
  --ink: #13211A;
  --muted: #55665B;
  --rule: #CCD7CE;
  --accent-text: #1E5B38;
  --danger: #B3261E;
  --focus: #F2B705;
  --team-bg: #2463B8;
  --team-fg: #FFFFFF;
  --cond: "Avenir Next Condensed", "sans-serif-condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 64px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --turf: #1B5234;
    --turf-deep: #10321F;
    --wash: #0E1712;
    --surface: #17231C;
    --ink: #E6EEE8;
    --muted: #9BAEA1;
    --rule: #2C3B32;
    --accent-text: #8FD3A8;
    --danger: #F2867D;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--wash);
  color: var(--ink);
  font: 16px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Header: the turf, with team tabs as chalk-outlined pills */
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--turf);
  color: var(--chalk);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
  border-bottom: 3px solid rgba(255,255,255,.85);
}
.app-name { font-weight: 600; font-size: 15px; opacity: .85; }
.team-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0 14px;
  scrollbar-width: none;
}
.team-tabs::-webkit-scrollbar { display: none; }
.team-tab {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 16px;
  border: 2px solid rgba(255,255,255,.75);
  border-radius: 999px;
  background: transparent;
  color: var(--chalk);
  font: 700 18px/1 var(--cond);
  font-stretch: condensed;
}
.team-tab[aria-current="true"] { background: var(--chalk); color: var(--turf-deep); border-color: var(--chalk); }
.team-tab .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 0 3px rgba(0,0,0,.25); }
.team-tab.add { padding: 0 14px; border-style: dashed; font-family: var(--body); font-weight: 600; font-size: 15px; }

main {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 96px);
}

.team-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 20px 0 14px; }
.team-head h1, .page-title {
  margin: 0;
  font: 800 34px/1 var(--cond);
  font-stretch: condensed;
  overflow-wrap: anywhere;
}
.team-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.page-title { margin: 20px 0 14px; }

/* Buttons */
.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 0 18px;
  border: 2px solid transparent;
  border-radius: 10px;
  font-weight: 600;
  font-size: 16px;
  text-decoration: none;
}
.btn-primary { background: var(--turf); color: #fff; }
.btn-quiet { background: transparent; border-color: var(--rule); color: var(--accent-text); }
.btn-danger { background: transparent; border-color: currentColor; color: var(--danger); }
.btn-small { min-height: 40px; padding: 0 14px; font-size: 15px; flex: none; }

/* Roster */
.roster { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.player {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 72px;
  padding: 10px 14px;
  border: 0;
  border-top: 1px solid var(--rule);
  background: none;
  text-align: left;
}
.roster li:first-child .player { border-top: 0; }
.player:active { background: var(--wash); }
.jersey-wrap { flex: none; filter: drop-shadow(0 0 1px rgba(0,0,0,.55)); }
.jersey {
  display: grid;
  place-items: center;
  width: 58px;
  height: 54px;
  padding-top: 10px;
  background: var(--team-bg);
  color: var(--team-fg);
  clip-path: polygon(32% 0, 68% 0, 100% 20%, 90% 44%, 78% 38%, 78% 100%, 22% 100%, 22% 38%, 10% 44%, 0 20%);
  font: 800 23px/1 var(--cond);
  font-stretch: condensed;
  font-variant-numeric: tabular-nums;
}
.jersey.blank { opacity: .4; }
.pinfo { flex: 1; min-width: 0; }
.pname { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.pnotes { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dup { color: var(--danger); font-size: 14px; font-weight: 600; }

.empty { background: var(--surface); border: 2px dashed var(--rule); border-radius: 14px; padding: 28px 20px; text-align: center; }
.empty p { margin: 0 0 16px; color: var(--muted); }

.fab {
  position: fixed;
  right: 16px;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 9;
  min-height: 54px;
  padding: 0 22px;
  border: 0;
  border-radius: 999px;
  background: var(--turf);
  color: #fff;
  font-weight: 700;
  font-size: 17px;
  box-shadow: 0 6px 18px rgba(10,30,18,.35);
}

.nudge {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #FFF4CF;
  color: #3D3000;
  font-size: 15px;
}
.nudge .btn { background: #3D3000; color: #FFF4CF; min-height: 40px; font-size: 15px; padding: 0 14px; flex: none; }

/* More / info pages */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.panel h2 { margin: 0 0 8px; font: 800 24px/1.1 var(--cond); font-stretch: condensed; }
.panel p { margin: 0 0 12px; }
.panel ol { margin: 0 0 12px; padding-left: 22px; }
.panel li { margin-bottom: 4px; }
.panel h3 { margin: 14px 0 6px; font-size: 16px; }
.meta { color: var(--muted); font-size: 15px; }
.warn { background: #FFF4CF; color: #3D3000; border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.version { text-align: center; color: var(--muted); font-size: 14px; }

.soon { padding-top: 4px; }
.soon .phase { display: inline-block; margin-bottom: 12px; padding: 4px 10px; border-radius: 999px; background: var(--turf); color: #fff; font-size: 14px; font-weight: 600; }
.soon p { max-width: 60ch; }

/* Bottom tab bar */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--rule);
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: var(--tabbar-h);
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.tab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.tab[aria-current="page"] { color: var(--accent-text); }
.tab[aria-current="page"] svg { stroke-width: 2.4; }

/* Bottom-sheet dialogs */
dialog {
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  margin: auto auto 0;
  padding: 0;
  border: 0;
  border-radius: 18px 18px 0 0;
  background: var(--surface);
  color: var(--ink);
}
dialog::backdrop { background: rgba(8,20,12,.55); }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 18px; } }
.sheet { max-height: 92vh; overflow: auto; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { margin: 0 0 16px; font: 800 28px/1.05 var(--cond); font-stretch: condensed; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--rule);
  border-radius: 10px;
  background: var(--wash);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
}
.field textarea { min-height: 88px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--turf); }
.pair { display: grid; grid-template-columns: 96px 1fr; gap: 12px; }
.pair-even { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input.num { font: 800 26px/1 var(--cond) !important; font-stretch: condensed; text-align: center; }
.error { min-height: 1.4em; margin: 0 0 10px; color: var(--danger); font-weight: 600; font-size: 15px; }
.actions { display: flex; gap: 10px; justify-content: flex-end; }
.actions .btn { white-space: nowrap; }
.danger-row { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 22px; padding: 0; border: 0; }
.swatches legend { margin-bottom: 8px; padding: 0; color: var(--muted); font-size: 14px; font-weight: 600; }
.swatch { position: relative; }
.swatch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.swatch span { display: block; width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }
.swatch input:checked + span { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
.swatch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 5px; }
.hint { margin: -6px 0 14px; color: var(--muted); font-size: 14px; }

/* Messages */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 84px);
  z-index: 30;
  max-width: calc(100% - 32px);
  padding: 12px 18px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--wash);
  font-weight: 600;
  width: max-content;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 8px);
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.update {
  position: fixed;
  left: 12px; right: 12px;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--wash);
  font-weight: 600;
}
.update[hidden] { display: none; }
.update button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--focus); color: #1A1A1A; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="app-name">Soccer Coach</div>
  <nav class="team-tabs" id="teamTabs" aria-label="Teams"></nav>
</header>

<main id="main"></main>

<button class="fab" id="fab" data-action="add-player">+ Add player</button>

<nav class="tabbar" aria-label="Sections">
  <button class="tab" data-action="nav" data-view="roster">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3h7l5 3.5-2.5 4-2-1.2V21H8V9.3L6 10.5 3.5 6.5z"/></svg>Roster
  </button>
  <button class="tab" data-action="nav" data-view="game">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.8"/></svg>Game
  </button>
  <button class="tab" data-action="nav" data-view="practice">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h4l5 15H5z"/><path d="M3 19h18"/><path d="M7.7 12h8.6"/></svg>Practice
  </button>
  <button class="tab" data-action="nav" data-view="rules">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Rules
  </button>
  <button class="tab" data-action="nav" data-view="more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More
  </button>
</nav>

<div class="update" id="updateBanner" hidden>
  <span>A new version is ready.</span>
  <button type="button" data-action="apply-update">Update now</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<dialog id="playerDialog" aria-labelledby="playerTitle">
  <form class="sheet" id="playerForm" novalidate>
    <h2 id="playerTitle">Add player</h2>
    <div class="pair">
      <label class="field"><span>Jersey #</span>
        <input class="num" name="number" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">
      </label>
      <label class="field"><span>Player name</span>
        <input name="name" type="text" autocomplete="off" autocapitalize="words" maxlength="60">
      </label>
    </div>
    <label class="field"><span>Notes (optional)</span>
      <textarea name="notes" maxlength="1000" placeholder="Allergies, pickup person, things to work on"></textarea>
    </label>
    <p class="error" id="playerError" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn btn-quiet" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save player</button>
    </div>
    <div class="danger-row" id="deletePlayerRow">
      <button type="button" class="btn btn-danger" id="deletePlayerBtn">Delete player</button>
    </div>
  </form>
</dialog>

<dialog id="teamDialog" aria-labelledby="teamTitle">
  <form class="sheet" id="teamForm" novalidate>
    <h2 id="teamTitle">Edit team</h2>
    <label class="field"><span>Team name</span>
      <input name="name" type="text" autocomplete="off" maxlength="40">
    </label>
    <label class="field"><span>Age group</span>
      <select name="ageGroup">
        <option>6U</option><option>7U</option><option>8U</option><option>10U</option>
        <option>12U</option><option>14U</option><option>16U</option><option>19U</option>
      </select>
    </label>
    <fieldset class="swatches field" id="colorSwatches">
      <legend>Jersey color</legend>
    </fieldset>
    <p class="hint">The details below fill in your lineup card once game day is built.</p>
    <div class="pair-even">
      <label class="field"><span>Region</span><input name="region" type="text" autocomplete="off" maxlength="20"></label>
      <label class="field"><span>Team #</span><input name="teamNumber" type="text" autocomplete="off" maxlength="20"></label>
    </div>
    <label class="field"><span>Coach</span><input name="coach" type="text" autocomplete="name" maxlength="60"></label>
    <label class="field"><span>Assistant coach</span><input name="asstCoach" type="text" autocomplete="off" maxlength="60"></label>
    <p class="error" id="teamError" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn btn-quiet" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save team</button>
    </div>
    <div class="danger-row" id="deleteTeamRow">
      <button type="button" class="btn btn-danger" id="deleteTeamBtn">Delete team</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';

  var KEY = 'soccerCoach.data';
  var APP_VERSION = '1.0';

  var COLORS = {
    blue:   { bg: '#2463B8', fg: '#FFFFFF', label: 'Blue' },
    red:    { bg: '#C62F2A', fg: '#FFFFFF', label: 'Red' },
    gold:   { bg: '#E8B01E', fg: '#1A1A1A', label: 'Gold' },
    green:  { bg: '#2E8B4A', fg: '#FFFFFF', label: 'Green' },
    orange: { bg: '#E5661A', fg: '#FFFFFF', label: 'Orange' },
    purple: { bg: '#6A3FA3', fg: '#FFFFFF', label: 'Purple' },
    sky:    { bg: '#46A6DB', fg: '#0E2230', label: 'Sky blue' },
    black:  { bg: '#23262A', fg: '#FFFFFF', label: 'Black' },
    white:  { bg: '#FFFFFF', fg: '#1A1A1A', label: 'White' }
  };
  var AGE_GROUPS = ['6U', '7U', '8U', '10U', '12U', '14U', '16U', '19U'];

  // ---------- Data ----------

  function uid(prefix) {
    return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function newTeam(name, ageGroup, color, id) {
    return { id: id || uid('t'), name: name, ageGroup: ageGroup, color: color,
             region: '', teamNumber: '', coach: '', asstCoach: '', players: [] };
  }
  function defaultData() {
    return {
      app: 'soccer-coach', version: 1,
      activeTeamId: 't-u8',
      lastBackupAt: null, lastChangedAt: null,
      teams: [newTeam('U8 team', '8U', 'blue', 't-u8'), newTeam('U10 team', '10U', 'gold', 't-u10')]
    };
  }
  function str(v, max) { return (typeof v === 'string' ? v : (v == null ? '' : String(v))).slice(0, max || 1000); }

  // Cleans up data from storage or a backup file so the app never trips over missing fields.
  function normalize(d) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.teams)) throw new Error('Not a Soccer Coach data file');
    var teams = d.teams.filter(function (t) { return t && typeof t === 'object'; }).map(function (t) {
      return {
        id: str(t.id, 60) || uid('t'),
        name: str(t.name, 40) || 'Team',
        ageGroup: AGE_GROUPS.indexOf(t.ageGroup) >= 0 ? t.ageGroup : '8U',
        color: COLORS[t.color] ? t.color : 'blue',
        region: str(t.region, 20), teamNumber: str(t.teamNumber, 20),
        coach: str(t.coach, 60), asstCoach: str(t.asstCoach, 60),
        players: (Array.isArray(t.players) ? t.players : []).filter(function (p) { return p && typeof p === 'object'; }).map(function (p) {
          return { id: str(p.id, 60) || uid('p'), number: str(p.number, 2).replace(/\D/g, ''),
                   name: str(p.name, 60) || 'Player', notes: str(p.notes, 1000) };
        })
      };
    });
    if (!teams.length) throw new Error('The file has no teams');
    var active = teams.some(function (t) { return t.id === d.activeTeamId; }) ? d.activeTeamId : teams[0].id;
    return { app: 'soccer-coach', version: 1, activeTeamId: active,
             lastBackupAt: d.lastBackupAt || null, lastChangedAt: d.lastChangedAt || null, teams: teams };
  }

  var storageOk = true;
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; return defaultData(); }
    if (!raw) return defaultData();
    try { return normalize(JSON.parse(raw)); }
    catch (e) {
      // Keep a copy of anything unreadable rather than overwriting it.
      try { localStorage.setItem(KEY + '.unreadable-' + Date.now(), raw); } catch (e2) {}
      return defaultData();
    }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { toast('Could not save. Your phone may be low on storage.'); return false; }
  }
  var askedPersist = false;
  function commit() {
    data.lastChangedAt = new Date().toISOString();
    persist();
    if (!askedPersist && navigator.storage && navigator.storage.persist) {
      askedPersist = true;
      navigator.storage.persist().catch(function () {});
    }
  }

  var data = load();
  var view = 'roster';

  function activeTeam() {
    return data.teams.find(function (t) { return t.id === data.activeTeamId; }) || data.teams[0];
  }
  function sortedPlayers(team) {
    return team.players.slice().sort(function (a, b) {
      var an = a.number === '' ? Infinity : parseInt(a.number, 10);
      var bn = b.number === '' ? Infinity : parseInt(b.number, 10);
      if (an !== bn) return an - bn;
      return a.name.localeCompare(b.name);
    });
  }
  function totalPlayers() {
    return data.teams.reduce(function (n, t) { return n + t.players.length; }, 0);
  }

  // ---------- Helpers ----------

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var toastTimer;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }
  function daysAgo(iso) {
    var then = new Date(iso); var now = new Date();
    var a = new Date(then.getFullYear(), then.getMonth(), then.getDate());
    var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((b - a) / 864e5);
  }
  function lastBackupText() {
    if (!data.lastBackupAt) return 'never';
    var d = daysAgo(data.lastBackupAt);
    if (d <= 0) return 'today';
    if (d === 1) return 'yesterday';
    return d + ' days ago';
  }
  function needsBackup() {
    if (!totalPlayers() || !data.lastChangedAt) return false;
    if (!data.lastBackupAt) return true;
    if (Date.parse(data.lastBackupAt) >= Date.parse(data.lastChangedAt)) return false;
    return Date.now() - Date.parse(data.lastBackupAt) > 7 * 864e5;
  }
  function isInstalled() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  // ---------- Rendering ----------

  function applyTeamColor() {
    var c = COLORS[activeTeam().color] || COLORS.blue;
    document.documentElement.style.setProperty('--team-bg', c.bg);
    document.documentElement.style.setProperty('--team-fg', c.fg);
  }

  function renderTabs() {
    var html = data.teams.map(function (t) {
      var c = COLORS[t.color] || COLORS.blue;
      return '<button class="team-tab" data-action="switch-team" data-id="' + esc(t.id) + '" aria-current="' + (t.id === data.activeTeamId) + '">' +
             '<span class="dot" style="background:' + c.bg + '"></span>' + esc(t.name) + '</button>';
    }).join('');
    html += '<button class="team-tab add" data-action="add-team" aria-label="Add a team">+ Team</button>';
    $('teamTabs').innerHTML = html;
  }

  function renderRoster() {
    var t = activeTeam();
    var players = sortedPlayers(t);
    var counts = {};
    players.forEach(function (p) { if (p.number !== '') counts[p.number] = (counts[p.number] || 0) + 1; });

    var html = '';
    if (needsBackup()) {
      html += '<div class="nudge"><span>You have roster changes that aren\'t backed up.</span>' +
              '<button class="btn" data-action="export">Back up now</button></div>';
    }
    html += '<div class="team-head"><div><h1>' + esc(t.name) + '</h1><p>' + esc(t.ageGroup) + ', ' +
            players.length + (players.length === 1 ? ' player' : ' players') + '</p></div>' +
            '<button class="btn btn-quiet btn-small" data-action="edit-team">Edit team</button></div>';

    if (!players.length) {
      html += '<div class="empty"><p>No players on this roster yet. Add your first player to start the ' + esc(t.name) + ' roster.</p>' +
              '<button class="btn btn-primary" data-action="add-player">Add player</button></div>';
    } else {
      html += '<ul class="roster">' + players.map(function (p) {
        var dup = p.number !== '' && counts[p.number] > 1;
        var sub = dup ? '<div class="dup">Another player also wears #' + esc(p.number) + '</div>'
                      : (p.notes ? '<div class="pnotes">' + esc(p.notes) + '</div>' : '');
        return '<li><button class="player" data-action="edit-player" data-id="' + esc(p.id) + '">' +
               '<span class="jersey-wrap"><span class="jersey' + (p.number === '' ? ' blank' : '') + '">' + (p.number === '' ? '?' : esc(p.number)) + '</span></span>' +
               '<span class="pinfo"><div class="pname">' + esc(p.name) + '</div>' + sub + '</span></button></li>';
      }).join('') + '</ul>';
    }
    return html;
  }

  function renderSoon(title, phase, text) {
    return '<div class="soon"><h1 class="page-title">' + title + '</h1><span class="phase">Coming in phase ' + phase + '</span>' +
           '<p>' + text + '</p></div>';
  }

  function renderMore() {
    var html = '<h1 class="page-title">More</h1>';
    html += '<section class="panel"><h2>Backup</h2>' +
            '<p>Your rosters are stored only on this device. Save a backup file after you make changes, and keep it somewhere safe, like the Files app, Google Drive, or an email to yourself.</p>' +
            '<p class="meta">Last backup: ' + lastBackupText() + '</p>' +
            '<div class="row"><button class="btn btn-primary" data-action="export">Save backup file</button>' +
            '<button class="btn btn-quiet" data-action="import">Restore from backup</button></div></section>';

    html += '<section class="panel"><h2>Install on your phone</h2>';
    if (isInstalled()) {
      html += '<p>Installed. You are using the home screen app, and it works without a signal.</p>';
    } else {
      html += '<p>Install the app so it opens from your home screen and works at fields with no signal.</p>';
      if (isIOS()) {
        html += '<p class="warn">On iPhone, the home screen app keeps its own separate data from Safari. Install first, then enter your rosters in the installed app.</p>';
      }
      html += '<h3>iPhone (Safari)</h3><ol><li>Tap the Share button (the square with an arrow).</li>' +
              '<li>Scroll down and tap <strong>Add to Home Screen</strong>.</li><li>Tap <strong>Add</strong>.</li></ol>' +
              '<h3>Android (Chrome)</h3><ol><li>Tap the three-dot menu in the top corner.</li>' +
              '<li>Tap <strong>Add to Home screen</strong> or <strong>Install app</strong>.</li><li>Tap <strong>Install</strong>.</li></ol>';
    }
    html += '</section>';

    html += '<section class="panel"><h2>Storage</h2><p id="persistStatus" class="meta">' +
            (storageOk ? 'Checking...' : 'This browser is blocking storage, so nothing will be saved. Private browsing mode is the usual cause.') +
            '</p></section>';
    html += '<p class="version">Soccer Coach ' + APP_VERSION + ', phase 1</p>';
    return html;
  }

  function updatePersistStatus() {
    var el = $('persistStatus');
    if (!el || !storageOk) return;
    if (!navigator.storage || !navigator.storage.persisted) {
      el.textContent = 'This browser may clear app data if the app goes unused for a while. Backups are your safety net.';
      return;
    }
    navigator.storage.persisted().then(function (yes) {
      el.textContent = yes
        ? 'Protected. This browser has agreed not to clear the app\'s data on its own. Keep making backups anyway.'
        : 'Not protected yet. The browser may clear data from apps that go unused for a while. Installing the app helps, and backups are your safety net.';
    }).catch(function () {});
  }

  function render() {
    applyTeamColor();
    renderTabs();
    var main = $('main');
    var html;
    if (view === 'roster') html = renderRoster();
    else if (view === 'game') html = renderSoon('Game day', 2, 'Plan fair rotations in half-quarter blocks, set lineups on the field, track who played which quarters, and fill in the lineup card.');
    else if (view === 'practice') html = renderSoon('Practice', 3, 'Build a drill library, stack drills into timed practice plans, and take attendance.');
    else if (view === 'rules') html = renderSoon('Rules', 4, 'Plain-language rules of the game, your region\'s small-sided rules, positions explained, and your own saved manuals.');
    else html = renderMore();
    main.innerHTML = html;
    $('fab').hidden = view !== 'roster' || activeTeam().players.length === 0;
    document.querySelectorAll('.tab').forEach(function (b) {
      if (b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    // The team tabs only matter on team pages.
    $('teamTabs').style.display = (view === 'roster') ? '' : 'none';
    if (view === 'more') updatePersistStatus();
  }

  // ---------- Player dialog ----------

  var editingPlayerId = null;
  function openPlayer(id) {
    var t = activeTeam();
    var p = id ? t.players.find(function (x) { return x.id === id; }) : null;
    editingPlayerId = p ? p.id : null;
    var f = $('playerForm');
    $('playerTitle').textContent = p ? 'Edit player' : 'Add player to ' + t.name;
    f.number.value = p ? p.number : '';
    f.name.value = p ? p.name : '';
    f.notes.value = p ? p.notes : '';
    $('playerError').textContent = '';
    $('deletePlayerRow').hidden = !p;
    $('playerDialog').showModal();
    if (!p) setTimeout(function () { f.number.focus(); }, 50);
  }

  $('playerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var t = activeTeam();
    var number = f.number.value.trim();
    var name = f.name.value.trim().replace(/\s+/g, ' ');
    var err = $('playerError');
    if (number !== '' && !/^\d{1,2}$/.test(number)) { err.textContent = 'Jersey numbers are 0 to 99. Leave it blank if you don\'t know it yet.'; return; }
    if (!name) { err.textContent = 'Enter the player\'s name.'; f.name.focus(); return; }
    var clash = number !== '' && t.players.find(function (x) { return x.number === number && x.id !== editingPlayerId; });
    if (clash) { err.textContent = '#' + number + ' already belongs to ' + clash.name + '. Pick another number.'; f.number.focus(); return; }

    if (editingPlayerId) {
      var p = t.players.find(function (x) { return x.id === editingPlayerId; });
      p.number = number; p.name = name; p.notes = f.notes.value.trim();
    } else {
      t.players.push({ id: uid('p'), number: number, name: name, notes: f.notes.value.trim() });
    }
    commit();
    $('playerDialog').close();
    render();
    toast(editingPlayerId ? 'Saved ' + name : 'Added ' + name);
  });

  $('deletePlayerBtn').addEventListener('click', function () {
    var t = activeTeam();
    var p = t.players.find(function (x) { return x.id === editingPlayerId; });
    if (!p) return;
    if (!confirm('Remove ' + p.name + ' from the ' + t.name + ' roster?')) return;
    t.players = t.players.filter(function (x) { return x.id !== p.id; });
    commit();
    $('playerDialog').close();
    render();
    toast('Removed ' + p.name);
  });

  // ---------- Team dialog ----------

  var editingTeamId = null;
  $('colorSwatches').insertAdjacentHTML('beforeend', Object.keys(COLORS).map(function (k) {
    return '<label class="swatch" title="' + COLORS[k].label + '"><input type="radio" name="color" value="' + k + '" aria-label="' + COLORS[k].label + '">' +
           '<span style="background:' + COLORS[k].bg + '"></span></label>';
  }).join(''));

  function openTeam(isNew) {
    var t = isNew ? null : activeTeam();
    editingTeamId = t ? t.id : null;
    var f = $('teamForm');
    $('teamTitle').textContent = t ? 'Edit team' : 'Add team';
    f.name.value = t ? t.name : '';
    f.ageGroup.value = t ? t.ageGroup : '8U';
    f.region.value = t ? t.region : '';
    f.teamNumber.value = t ? t.teamNumber : '';
    f.coach.value = t ? t.coach : (data.teams[0] ? data.teams[0].coach : '');
    f.asstCoach.value = t ? t.asstCoach : '';
    var color = t ? t.color : 'green';
    f.querySelectorAll('input[name="color"]').forEach(function (r) { r.checked = r.value === color; });
    $('teamError').textContent = '';
    $('deleteTeamRow').hidden = !t || data.teams.length < 2;
    $('teamDialog').showModal();
  }

  $('teamForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var name = f.name.value.trim().replace(/\s+/g, ' ');
    if (!name) { $('teamError').textContent = 'Enter a team name.'; f.name.focus(); return; }
    var picked = f.querySelector('input[name="color"]:checked');
    var fields = {
      name: name, ageGroup: f.ageGroup.value, color: picked ? picked.value : 'blue',
      region: f.region.value.trim(), teamNumber: f.teamNumber.value.trim(),
      coach: f.coach.value.trim(), asstCoach: f.asstCoach.value.trim()
    };
    if (editingTeamId) {
      Object.assign(activeTeam(), fields);
    } else {
      var t = newTeam(fields.name, fields.ageGroup, fields.color);
      Object.assign(t, fields);
      data.teams.push(t);
      data.activeTeamId = t.id;
    }
    commit();
    $('teamDialog').close();
    view = 'roster';
    render();
    toast('Saved ' + name);
  });

  $('deleteTeamBtn').addEventListener('click', function () {
    var t = activeTeam();
    var n = t.players.length;
    var msg = 'Delete ' + t.name + (n ? ' and its ' + n + (n === 1 ? ' player' : ' players') : '') + '? This can\'t be undone unless you have a backup.';
    if (!confirm(msg)) return;
    data.teams = data.teams.filter(function (x) { return x.id !== t.id; });
    data.activeTeamId = data.teams[0].id;
    commit();
    $('teamDialog').close();
    render();
    toast('Deleted ' + t.name);
  });

  // Close buttons and tapping the backdrop close a sheet.
  document.querySelectorAll('dialog').forEach(function (d) {
    d.addEventListener('click', function (e) { if (e.target === d) d.close(); });
    d.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { d.close(); }); });
  });

  // ---------- Backup and restore ----------

  function dateStamp() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function markBackedUp() {
    data.lastBackupAt = new Date().toISOString();
    persist();
    render();
    toast('Backup saved');
  }
  function exportBackup() {
    var json = JSON.stringify({ app: 'soccer-coach', kind: 'backup', exportedAt: new Date().toISOString(), data: data }, null, 2);
    var name = 'soccer-coach-backup-' + dateStamp() + '.json';
    var file;
    try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    // On phones, the share sheet lets you save to Files, Drive, or email it to yourself.
    if (file && touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Soccer Coach backup' })
        .then(markBackedUp)
        .catch(function (err) { if (err && err.name !== 'AbortError') downloadFile(json, name); });
      return;
    }
    downloadFile(json, name);
  }
  function downloadFile(text, name) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    markBackedUp();
  }

  $('importInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed, restored;
      try {
        parsed = JSON.parse(reader.result);
        if (!parsed || parsed.app !== 'soccer-coach') throw new Error('wrong app');
        restored = normalize(parsed.data);
      } catch (err) {
        alert('That file isn\'t a Soccer Coach backup. Pick a file named like soccer-coach-backup-2026-09-27.json.');
        return;
      }
      var players = restored.teams.reduce(function (n, t) { return n + t.players.length; }, 0);
      var when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : 'an unknown date';
      if (!confirm('Restore the backup from ' + when + '? It has ' + restored.teams.length + ' teams and ' + players +
                   ' players, and it replaces everything currently on this device.')) return;
      restored.lastBackupAt = parsed.exportedAt || new Date().toISOString();
      restored.lastChangedAt = restored.lastBackupAt;
      data = restored;
      persist();
      view = 'roster';
      render();
      toast('Backup restored');
    };
    reader.onerror = function () { alert('Could not read that file. Try picking it again.'); };
    reader.readAsText(file);
  });

  // ---------- Taps ----------

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.dataset.action;
    if (a === 'nav') { view = el.dataset.view; render(); window.scrollTo(0, 0); }
    else if (a === 'switch-team') { data.activeTeamId = el.dataset.id; persist(); render(); }
    else if (a === 'add-team') openTeam(true);
    else if (a === 'edit-team') openTeam(false);
    else if (a === 'add-player') openPlayer(null);
    else if (a === 'edit-player') openPlayer(el.dataset.id);
    else if (a === 'export') exportBackup();
    else if (a === 'import') $('importInput').click();
    else if (a === 'apply-update') applyUpdate();
  });

  // ---------- Offline support and updates ----------

  var waitingWorker = null;
  var updateRequested = false;
  function showUpdate(worker) { waitingWorker = worker; $('updateBanner').hidden = false; }
  function applyUpdate() {
    updateRequested = true;
    if (waitingWorker) waitingWorker.postMessage('skipWaiting'); else location.reload();
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', function () {
            if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
          });
        });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update().catch(function () {});
        });
      }).catch(function (err) { console.warn('Offline support unavailable:', err); });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (updateRequested) location.reload();
      });
    });
  }

  render();
})();
</script>
</body>
</html>
