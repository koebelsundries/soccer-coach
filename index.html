<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Soccer Coach</title>
<style>
:root {
  --turf: #1E5B38;
  --turf-deep: #154129;
  --chalk: #FFFFFF;
  --wash: #E8EEE6;
  --surface: #FFFFFF;
  --ink: #13211A;
  --muted: #55665B;
  --rule: #CCD7CE;
  --accent-text: #1E5B38;
  --danger: #B3261E;
  --focus: #F2B705;
  --team-bg: #2463B8;
  --team-fg: #FFFFFF;
  --cond: "Avenir Next Condensed", "sans-serif-condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 64px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --turf: #1B5234;
    --turf-deep: #10321F;
    --wash: #0E1712;
    --surface: #17231C;
    --ink: #E6EEE8;
    --muted: #9BAEA1;
    --rule: #2C3B32;
    --accent-text: #8FD3A8;
    --danger: #F2867D;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--wash);
  color: var(--ink);
  font: 16px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Header: the turf, with team tabs as chalk-outlined pills */
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--turf);
  color: var(--chalk);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
  border-bottom: 3px solid rgba(255,255,255,.85);
}
.app-name { font-weight: 600; font-size: 15px; opacity: .85; }
.team-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0 14px;
  scrollbar-width: none;
}
.team-tabs::-webkit-scrollbar { display: none; }
.team-tab {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 16px;
  border: 2px solid rgba(255,255,255,.75);
  border-radius: 999px;
  background: transparent;
  color: var(--chalk);
  font: 700 18px/1 var(--cond);
  font-stretch: condensed;
}
.team-tab[aria-current="true"] { background: var(--chalk); color: var(--turf-deep); border-color: var(--chalk); }
.team-tab .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 0 3px rgba(0,0,0,.25); }
.team-tab.add { padding: 0 14px; border-style: dashed; font-family: var(--body); font-weight: 600; font-size: 15px; }

main {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 96px);
}

.team-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 20px 0 14px; }
.team-head h1, .page-title {
  margin: 0;
  font: 800 34px/1 var(--cond);
  font-stretch: condensed;
  overflow-wrap: anywhere;
}
.team-head p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.page-title { margin: 20px 0 14px; }

/* Buttons */
.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 0 18px;
  border: 2px solid transparent;
  border-radius: 10px;
  font-weight: 600;
  font-size: 16px;
  text-decoration: none;
}
.btn-primary { background: var(--turf); color: #fff; }
.btn-quiet { background: transparent; border-color: var(--rule); color: var(--accent-text); }
.btn-danger { background: transparent; border-color: currentColor; color: var(--danger); }
.btn-small { min-height: 40px; padding: 0 14px; font-size: 15px; flex: none; }

/* Roster */
.roster { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.player {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 72px;
  padding: 10px 14px;
  border: 0;
  border-top: 1px solid var(--rule);
  background: none;
  text-align: left;
}
.roster li:first-child .player { border-top: 0; }
.player:active { background: var(--wash); }
.jersey-wrap { flex: none; filter: drop-shadow(0 0 1px rgba(0,0,0,.55)); }
.jersey {
  display: grid;
  place-items: center;
  width: 58px;
  height: 54px;
  padding-top: 10px;
  background: var(--team-bg);
  color: var(--team-fg);
  clip-path: polygon(32% 0, 68% 0, 100% 20%, 90% 44%, 78% 38%, 78% 100%, 22% 100%, 22% 38%, 10% 44%, 0 20%);
  font: 800 23px/1 var(--cond);
  font-stretch: condensed;
  font-variant-numeric: tabular-nums;
}
.jersey.blank { opacity: .4; }
.pinfo { flex: 1; min-width: 0; }
.pname { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.pnotes { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dup { color: var(--danger); font-size: 14px; font-weight: 600; }

.empty { background: var(--surface); border: 2px dashed var(--rule); border-radius: 14px; padding: 28px 20px; text-align: center; }
.empty p { margin: 0 0 16px; color: var(--muted); }

.fab {
  position: fixed;
  right: 16px;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px);
  z-index: 9;
  min-height: 54px;
  padding: 0 22px;
  border: 0;
  border-radius: 999px;
  background: var(--turf);
  color: #fff;
  font-weight: 700;
  font-size: 17px;
  box-shadow: 0 6px 18px rgba(10,30,18,.35);
}

.nudge {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #FFF4CF;
  color: #3D3000;
  font-size: 15px;
}
.nudge .btn { background: #3D3000; color: #FFF4CF; min-height: 40px; font-size: 15px; padding: 0 14px; flex: none; }

/* More / info pages */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.panel h2 { margin: 0 0 8px; font: 800 24px/1.1 var(--cond); font-stretch: condensed; }
.panel p { margin: 0 0 12px; }
.panel ol { margin: 0 0 12px; padding-left: 22px; }
.panel li { margin-bottom: 4px; }
.panel h3 { margin: 14px 0 6px; font-size: 16px; }
.meta { color: var(--muted); font-size: 15px; }
.warn { background: #FFF4CF; color: #3D3000; border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.version { text-align: center; color: var(--muted); font-size: 14px; }

.soon { padding-top: 4px; }
.soon .phase { display: inline-block; margin-bottom: 12px; padding: 4px 10px; border-radius: 999px; background: var(--turf); color: #fff; font-size: 14px; font-weight: 600; }
.soon p { max-width: 60ch; }

/* Bottom tab bar */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--rule);
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  height: var(--tabbar-h);
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.tab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.tab[aria-current="page"] { color: var(--accent-text); }
.tab[aria-current="page"] svg { stroke-width: 2.4; }

/* Bottom-sheet dialogs */
dialog {
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  margin: auto auto 0;
  padding: 0;
  border: 0;
  border-radius: 18px 18px 0 0;
  background: var(--surface);
  color: var(--ink);
}
dialog::backdrop { background: rgba(8,20,12,.55); }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 18px; } }
.sheet { max-height: 92vh; overflow: auto; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { margin: 0 0 16px; font: 800 28px/1.05 var(--cond); font-stretch: condensed; }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea {
  width: 100%;
  padding: 12px;
  border: 2px solid var(--rule);
  border-radius: 10px;
  background: var(--wash);
  color: var(--ink);
  font: inherit;
  font-size: 17px;
}
.field textarea { min-height: 88px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--turf); }
.pair { display: grid; grid-template-columns: 96px 1fr; gap: 12px; }
.pair-even { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
input.num { font: 800 26px/1 var(--cond) !important; font-stretch: condensed; text-align: center; }
.error { min-height: 1.4em; margin: 0 0 10px; color: var(--danger); font-weight: 600; font-size: 15px; }
.actions { display: flex; gap: 10px; justify-content: flex-end; }
.actions .btn { white-space: nowrap; }
.danger-row { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 22px; padding: 0; border: 0; }
.swatches legend { margin-bottom: 8px; padding: 0; color: var(--muted); font-size: 14px; font-weight: 600; }
.swatch { position: relative; }
.swatch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.swatch span { display: block; width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); }
.swatch input:checked + span { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
.swatch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 5px; }
.hint { margin: -6px 0 14px; color: var(--muted); font-size: 14px; }

/* Messages */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 84px);
  z-index: 30;
  max-width: calc(100% - 32px);
  padding: 12px 18px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--wash);
  font-weight: 600;
  width: max-content;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 8px);
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.update {
  position: fixed;
  left: 12px; right: 12px;
  top: calc(env(safe-area-inset-top, 0px) + 8px);
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--wash);
  font-weight: 600;
}
.update[hidden] { display: none; }
.update button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--focus); color: #1A1A1A; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- Phase 2: game day ---------- */
.game-row {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 70px; padding: 10px 14px; border: 0; border-top: 1px solid var(--rule);
  background: none; text-align: left;
}
.roster li:first-child .game-row { border-top: 0; }
.gdate { flex: none; width: 54px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.2; }
.gdate b { display: block; color: var(--ink); font: 800 20px/1.05 var(--cond); font-stretch: condensed; }
.gname { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.pill { flex: none; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--wash); color: var(--muted); }
.pill.live { background: #FFE7A3; color: #4A3700; }
.pill.done { background: var(--turf); color: #fff; }

.back { margin: 14px 0 0; padding: 8px 0; border: 0; background: none; color: var(--accent-text); font-weight: 700; font-size: 16px; }
.game-title { margin: 6px 0 2px; font: 800 32px/1.05 var(--cond); font-stretch: condensed; overflow-wrap: anywhere; }
.game-sub { margin: 0 0 14px; color: var(--muted); font-size: 15px; }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; margin-bottom: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--rule); }
.seg button { min-height: 42px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 700; font-size: 15px; }
.seg button[aria-current="true"] { background: var(--turf); color: #fff; }

.att-row { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--rule); }
.att-row:first-child { border-top: 0; }
.att-row .jmini { grid-row: span 2; }
.att-row .nm { font-weight: 600; overflow-wrap: anywhere; }
.att-row select { width: 100%; padding: 8px 10px; border: 2px solid var(--rule); border-radius: 8px; background: var(--wash); color: var(--ink); font: inherit; font-size: 16px; }
.att-row .sel-pair { display: flex; gap: 8px; }
.jmini {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: var(--team-bg); color: var(--team-fg); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  font: 800 16px/1 var(--cond); font-stretch: condensed; flex: none;
}

/* Field diagram */
.pitch { display: block; width: 100%; max-width: 420px; max-height: 62vh; margin: 0 auto; border-radius: 12px; touch-action: manipulation; }
.pitch .mk { cursor: pointer; }
.pitch text { font-family: var(--cond); font-stretch: condensed; }
.mk-name { font-size: 4.8px; font-weight: 700; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 1.3px; }
.mk-pos { font-size: 3.6px; font-weight: 700; fill: rgba(255,255,255,.9); text-anchor: middle; }

.blocks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.qgroup { text-align: center; }
.qgroup > span { display: block; margin-bottom: 4px; font: 800 17px/1 var(--cond); font-stretch: condensed; }
.qgroup .halves { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.blk { position: relative; min-height: 40px; padding: 0; border: 2px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; }
.blk[aria-current="true"] { background: var(--turf); border-color: var(--turf); color: #fff; }
.blk.gap::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
.blk-caption { margin: 0 0 10px; text-align: center; color: var(--muted); font-size: 15px; }

.toolrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.toolrow .btn { flex: 1 1 auto; }

.bench { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 4px 12px 4px 4px; border: 2px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px; }
.chip small { color: var(--muted); font-weight: 600; }
.chip .jmini { width: 30px; height: 30px; font-size: 15px; }

.section-title { margin: 22px 0 8px; font: 800 22px/1.1 var(--cond); font-stretch: condensed; }
.warnlist { list-style: none; margin: 0 0 12px; padding: 0; }
.warnlist li { margin-bottom: 6px; padding: 10px 12px; border-radius: 10px; background: #FFF4CF; color: #3D3000; font-size: 15px; }
.warnlist li.bad { background: #FDE2DF; color: #6B1510; }
.okline { padding: 10px 12px; border-radius: 10px; background: #DDF1E3; color: #0F3D22; font-size: 15px; margin-bottom: 12px; }

.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
table.grid { width: 100%; border-collapse: collapse; font-size: 15px; }
table.grid th, table.grid td { padding: 8px 6px; border-top: 1px solid var(--rule); text-align: center; white-space: nowrap; }
table.grid thead th { border-top: 0; color: var(--muted); font-size: 13px; font-weight: 700; }
table.grid td.l, table.grid th.l { text-align: left; white-space: normal; min-width: 96px; }
table.grid .num { font: 800 18px/1 var(--cond); font-stretch: condensed; }
.hq { display: inline-flex; gap: 2px; }
.hq span, .hq button { display: block; width: 13px; height: 22px; padding: 0; border: 2px solid var(--rule); background: transparent; }
.hq span:first-child, .hq button:first-child { border-radius: 5px 0 0 5px; }
.hq span:last-child, .hq button:last-child { border-radius: 0 5px 5px 0; }
.hq .on { background: var(--turf); border-color: var(--turf); }
.hq button { width: 20px; height: 30px; cursor: pointer; }
.hq button.fixed { outline: 2px dashed var(--focus); outline-offset: 1px; }

/* Live */
.clockbox { padding: 16px; margin-bottom: 14px; border-radius: 14px; background: var(--turf); color: #fff; text-align: center; }
.clock-q { font-weight: 700; opacity: .9; }
.clock { font: 800 64px/1 var(--cond); font-stretch: condensed; font-variant-numeric: tabular-nums; letter-spacing: 1px; margin: 6px 0 2px; }
.clock-meta { font-size: 15px; opacity: .85; min-height: 1.4em; }
.clock-meta.over { opacity: 1; color: #FFE08A; font-weight: 700; }
.clockbox .row { justify-content: center; margin-top: 12px; }
.btn-chalk { background: #fff; color: var(--turf-deep); }
.btn-outline-chalk { background: transparent; border-color: rgba(255,255,255,.8); color: #fff; }
.planned { padding: 14px; margin-bottom: 14px; border-radius: 14px; background: #FFF4CF; color: #3D3000; }
.planned h3 { margin: 0 0 4px; font-size: 17px; }
.planned p { margin: 0 0 8px; font-size: 15px; }
.planned ul { margin: 0 0 10px; padding-left: 20px; }
.planned .btn { background: #3D3000; color: #FFF4CF; }
.time-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--rule); }
.time-row:first-child { border-top: 0; }
.time-row .nm { font-weight: 600; overflow-wrap: anywhere; }
.time-row .st { font-size: 13px; color: var(--muted); }
.time-row .st.on { color: var(--accent-text); font-weight: 700; }
.time-row .t { font: 800 20px/1 var(--cond); font-stretch: condensed; font-variant-numeric: tabular-nums; text-align: right; }
.bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--turf); }
.bar i.low { background: var(--danger); }

/* Lineup card */
.lcard { padding: 14px; margin-bottom: 14px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: #111; }
.lcard h2 { margin: 0 0 10px; text-align: center; font: 800 22px/1 var(--cond); font-stretch: condensed; letter-spacing: .5px; }
.lcard dl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px; margin: 0 0 12px; font-size: 14px; }
.lcard dt { color: #555; font-size: 12px; }
.lcard dd { margin: 0; font-weight: 700; border-bottom: 1px solid #999; min-height: 1.4em; overflow-wrap: anywhere; }
.lcard table { width: 100%; border-collapse: collapse; font-size: 14px; }
.lcard th, .lcard td { border: 1px solid #333; padding: 6px 4px; text-align: center; }
.lcard th { font-size: 12px; background: #f1f1f1; }
.lcard td.l { text-align: left; }
.lcard .x { font-weight: 800; font-size: 16px; }
.lcard .why { font-style: italic; color: #333; }
.lcard-note { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 32px; height: 32px; border: 2px solid var(--rule); border-radius: 8px; background: var(--surface); font-weight: 800; }
.radio-row { display: flex; flex-direction: column; gap: 8px; }
.radio-row label { display: flex; gap: 10px; align-items: center; min-height: 40px; }
.radio-row input { width: 22px; height: 22px; accent-color: var(--turf); }

/* Picker sheet */
.picklist { display: flex; flex-direction: column; margin-bottom: 14px; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.pick-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; }
.pick-row:first-child { border-top: 0; }
.pick-row .nm { flex: 1; font-weight: 600; }
.pick-row .dt { color: var(--muted); font-size: 14px; text-align: right; }
.pick-row.empty-opt .nm { color: var(--muted); }

/* ---------- Version 3: lineups, subs, practice ---------- */
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.quarters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.quarters .blk { min-height: 44px; font: 800 18px/1 var(--cond); font-stretch: condensed; }
.lineup-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
.lineup-bar .lb-name { font-weight: 700; overflow-wrap: anywhere; }
.lineup-bar .lb-form { color: var(--muted); font-size: 14px; }
.btn-sub { flex: 1 1 100%; min-height: 56px; font-size: 19px; }
.hq1 { display: inline-block; width: 22px; height: 22px; border: 2px solid var(--rule); border-radius: 6px; background: transparent; padding: 0; vertical-align: middle; }
.hq1.on { background: var(--turf); border-color: var(--turf); }
button.hq1 { width: 30px; height: 30px; cursor: pointer; }
button.hq1.fixed { outline: 2px dashed var(--focus); outline-offset: 1px; }
.lines-edit { display: grid; gap: 10px; margin-bottom: 14px; }
.line-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.line-row .stepper b { min-width: 22px; text-align: center; font: 800 22px/1 var(--cond); font-stretch: condensed; }
.list-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 14px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; }
.roster li:first-child .list-row { border-top: 0; }
.list-row .main { flex: 1; min-width: 0; }
.list-row .title { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.list-row .sub { color: var(--muted); font-size: 14px; }
.tpill { flex: none; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .2px; }
.tpill.drill { background: #DCEBFF; color: #12386E; }
.tpill.game { background: #FFE7C2; color: #5A3300; }
.tpill.setplay { background: #E6DDF7; color: #3A1F6B; }
.tpill.break { background: #DDF1E3; color: #0F3D22; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.fchip { min-height: 36px; padding: 0 12px; border: 2px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--wash); }
.search { width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 2px solid var(--rule); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.detail h3 { margin: 16px 0 4px; font-size: 15px; color: var(--muted); }
.detail p { margin: 0; white-space: pre-wrap; }
.item-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 10px 14px; border-top: 1px solid var(--rule); align-items: center; }
.item-row:first-child { border-top: 0; }
.item-row .nm { font-weight: 700; overflow-wrap: anywhere; }
.item-row .ctrls { grid-column: 1 / 3; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.item-row .ctrls input { width: 64px; padding: 6px 8px; border: 2px solid var(--rule); border-radius: 8px; background: var(--wash); color: var(--ink); font: inherit; font-size: 16px; text-align: center; }
.mini { min-width: 38px; height: 38px; padding: 0 10px; border: 2px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 800; }
.mini.danger { color: var(--danger); }
.totline { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-weight: 700; }
.totline .over { color: var(--danger); }
.check-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px; border-top: 1px solid var(--rule); }
.check-row:first-child { border-top: 0; }
.check-row input { flex: none; width: 24px; height: 24px; accent-color: var(--turf); }
.run-head { padding: 16px; margin: 14px 0; border-radius: 14px; background: var(--turf); color: #fff; text-align: center; }
.run-head .clock { font-size: 72px; }
.run-step { font-weight: 700; opacity: .9; }
.run-name { margin: 4px 0 0; font: 800 28px/1.1 var(--cond); font-stretch: condensed; }
.next-up { color: var(--muted); font-size: 15px; margin: 0 0 12px; }

/* Diagram editor */
.dg-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.dg-tool { min-height: 44px; padding: 0 4px; border: 2px solid var(--rule); border-radius: 10px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13px; }
.dg-tool[aria-pressed="true"] { background: var(--turf); border-color: var(--turf); color: #fff; }
.pitch.edit { touch-action: none; cursor: crosshair; }
.dg-hint { min-height: 1.4em; margin: 6px 0; color: var(--muted); font-size: 14px; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 6px 0 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header class="top">
  <div class="app-name">Soccer Coach</div>
  <nav class="team-tabs" id="teamTabs" aria-label="Teams"></nav>
</header>

<main id="main"></main>

<button class="fab" id="fab" data-action="add-player">+ Add player</button>

<nav class="tabbar" aria-label="Sections">
  <button class="tab" data-action="nav" data-view="roster">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3h7l5 3.5-2.5 4-2-1.2V21H8V9.3L6 10.5 3.5 6.5z"/></svg>Roster
  </button>
  <button class="tab" data-action="nav" data-view="game">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="1"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.8"/></svg>Game
  </button>
  <button class="tab" data-action="nav" data-view="practice">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h4l5 15H5z"/><path d="M3 19h18"/><path d="M7.7 12h8.6"/></svg>Practice
  </button>
  <button class="tab" data-action="nav" data-view="rules">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Rules
  </button>
  <button class="tab" data-action="nav" data-view="more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More
  </button>
</nav>

<div class="update" id="updateBanner" hidden>
  <span>A new version is ready.</span>
  <button type="button" data-action="apply-update">Update now</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>
<input type="file" id="libImport" accept=".json,application/json" hidden>

<dialog id="playerDialog" aria-labelledby="playerTitle">
  <form class="sheet" id="playerForm" novalidate>
    <h2 id="playerTitle">Add player</h2>
    <div class="pair">
      <label class="field"><span>Jersey #</span>
        <input class="num" name="number" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">
      </label>
      <label class="field"><span>Player name</span>
        <input name="name" type="text" autocomplete="off" autocapitalize="words" maxlength="60">
      </label>
    </div>
    <label class="field"><span>Notes (optional)</span>
      <textarea name="notes" maxlength="1000" placeholder="Allergies, pickup person, things to work on"></textarea>
    </label>
    <p class="error" id="playerError" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn btn-quiet" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save player</button>
    </div>
    <div class="danger-row" id="deletePlayerRow">
      <button type="button" class="btn btn-danger" id="deletePlayerBtn">Delete player</button>
    </div>
  </form>
</dialog>

<dialog id="teamDialog" aria-labelledby="teamTitle">
  <form class="sheet" id="teamForm" novalidate>
    <h2 id="teamTitle">Edit team</h2>
    <label class="field"><span>Team name</span>
      <input name="name" type="text" autocomplete="off" maxlength="40">
    </label>
    <label class="field"><span>Age group</span>
      <select name="ageGroup" id="teamAge"></select>
    </label>
    <label class="field"><span>Game format</span>
      <select name="format" id="teamFormat"></select>
    </label>
    <label class="field"><span>Quarter length (minutes)</span>
      <input name="quarterMin" type="number" inputmode="decimal" min="1" max="45" step="0.5">
    </label>
    <div class="radio-row" style="margin-bottom:14px"><label><input type="checkbox" name="buildOut"> Show the build-out line on the field</label></div>
    <fieldset class="swatches field" id="colorSwatches">
      <legend>Jersey color</legend>
    </fieldset>
    <p class="hint" id="teamCardRule"></p>
    <p class="hint">The details below fill in your lineup card.</p>
    <div class="pair-even">
      <label class="field"><span>Region</span><input name="region" type="text" autocomplete="off" maxlength="20"></label>
      <label class="field"><span>Team #</span><input name="teamNumber" type="text" autocomplete="off" maxlength="20"></label>
    </div>
    <label class="field"><span>Coach</span><input name="coach" type="text" autocomplete="name" maxlength="60"></label>
    <label class="field"><span>Assistant coach</span><input name="asstCoach" type="text" autocomplete="off" maxlength="60"></label>
    <p class="error" id="teamError" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn btn-quiet" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save team</button>
    </div>
    <div class="danger-row" id="deleteTeamRow">
      <button type="button" class="btn btn-danger" id="deleteTeamBtn">Delete team</button>
    </div>
  </form>
</dialog>

<dialog id="pickDialog" aria-labelledby="pickTitle">
  <div class="sheet">
    <h2 id="pickTitle">Choose</h2>
    <p class="meta" id="pickSub"></p>
    <div class="picklist" id="pickList"></div>
    <div class="actions"><button type="button" class="btn btn-quiet" data-close>Cancel</button></div>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  var KEY = 'soccerCoach.data';
  var APP_VERSION = '3.5';

  var COLORS = {
    blue:   { bg: '#2463B8', fg: '#FFFFFF', label: 'Blue' },
    red:    { bg: '#C62F2A', fg: '#FFFFFF', label: 'Red' },
    gold:   { bg: '#E8B01E', fg: '#1A1A1A', label: 'Gold' },
    green:  { bg: '#2E8B4A', fg: '#FFFFFF', label: 'Green' },
    orange: { bg: '#E5661A', fg: '#FFFFFF', label: 'Orange' },
    purple: { bg: '#6A3FA3', fg: '#FFFFFF', label: 'Purple' },
    sky:    { bg: '#46A6DB', fg: '#0E2230', label: 'Sky blue' },
    black:  { bg: '#23262A', fg: '#FFFFFF', label: 'Black' },
    white:  { bg: '#FFFFFF', fg: '#1A1A1A', label: 'White' }
  };
  var AGE_GROUPS = ['5U', '6U', '8U', '10U', '12U', '15U'];  // From the region's player-on-field chart

  // Formats: how many on the field and whether one of them is a keeper.
  var FORMATS = {
    '3v3':     { size: 3, keeper: false, label: '3v3, no keeper',   def: [1, 1, 1] },
    '4v4':     { size: 4, keeper: false, label: '4v4, no keeper',   def: [2, 0, 2] },
    '5v5open': { size: 5, keeper: false, label: '5v5, no keeper',   def: [2, 1, 2] },
    '5v5':     { size: 5, keeper: true,  label: '5v5 (4 + keeper)', def: [2, 0, 2] },
    '7v7':     { size: 7, keeper: true,  label: '7v7 (6 + keeper)', def: [2, 3, 1] },
    '9v9':     { size: 9, keeper: true,  label: '9v9 (8 + keeper)', def: [3, 3, 2] },
    '11v11':   { size: 11, keeper: true, label: '11v11 (10 + keeper)', def: [4, 4, 2] }
  };
  // From the region's charts: [format, quarter minutes, total event minutes, ball size, warm-up on the field?]
  // Every division: 2-minute water breaks after Q1 and Q3, 5-minute halftime, 10-minute warm-up.
  var AGE_DEFAULTS = {
    '5U':  ['3v3', 5, 39, 3, true],
    '6U':  ['4v4', 6, 43, 3, true],
    '8U':  ['5v5open', 10, 49, 3, false],
    '10U': ['7v7', 12.5, 59, 4, false],
    '12U': ['9v9', 15, 69, 4, false],
    '15U': ['11v11', 17.5, 79, 5, false]
  };
  // Quarter lengths used before the region's game-time chart, so saved teams can be updated.
  var OLD_QUARTERS = { '5U': 5, '6U': 5, '15U': 20 };
  // Older saves may use age groups that aren't on the chart.
  var AGE_MAP = { '7U': '8U', '14U': '15U', '16U': '15U', '19U': '15U' };
  var COMMON_FORMS = {
    '7v7': ['2-3-1', '3-2-1', '2-2-2', '3-1-2', '2-1-3'],
    '9v9': ['3-3-2', '3-2-3', '2-4-2', '3-4-1', '4-3-1', '2-3-3'],
    '11v11': ['4-4-2', '4-3-3', '3-5-2', '4-5-1', '3-4-3', '5-3-2', '4-2-4']
  };
  var LINE_LABELS = {
    D: { 1: ['D'], 2: ['LD', 'RD'], 3: ['LD', 'CD', 'RD'], 4: ['LD', 'LCD', 'RCD', 'RD'], 5: ['LWB', 'LCD', 'CD', 'RCD', 'RWB'] },
    M: { 1: ['CM'], 2: ['LM', 'RM'], 3: ['LM', 'CM', 'RM'], 4: ['LM', 'LCM', 'RCM', 'RM'], 5: ['LM', 'LCM', 'CM', 'RCM', 'RM'] },
    F: { 1: ['ST'], 2: ['LF', 'RF'], 3: ['LF', 'CF', 'RF'], 4: ['LF', 'LCF', 'RCF', 'RF'] }
  };
  var LINE_X = { 1: [.5], 2: [.3, .7], 3: [.17, .5, .83], 4: [.12, .37, .63, .88], 5: [.1, .3, .5, .7, .9] };
  var POS_NAMES = {
    GK: 'Keeper', D: 'Defender', LD: 'Left defender', CD: 'Center defender', RD: 'Right defender',
    LCD: 'Left-center defender', RCD: 'Right-center defender', LWB: 'Left wing-back', RWB: 'Right wing-back',
    CM: 'Center midfielder', LM: 'Left midfielder', RM: 'Right midfielder',
    LCM: 'Left-center midfielder', RCM: 'Right-center midfielder',
    ST: 'Striker', LF: 'Left forward', RF: 'Right forward', CF: 'Center forward',
    LCF: 'Left-center forward', RCF: 'Right-center forward'
  };
  var ABSENT_REASONS = ['Sick', 'Injured', 'Family', 'No-show', 'Other'];
  var WATER_BREAK = 120, HALFTIME = 300;  // Seconds, from the region's game-time chart
  function breakLeft(L) { return L.breakAt ? L.breakLen - (Date.now() - L.breakAt) / 1000 : 0; }
  function breakName(L) { return L.breakLen >= HALFTIME ? 'Halftime' : 'Water break'; }
  var ENTRY_TYPES = { drill: 'Drill', game: 'Fun game', setplay: 'Set play' };

  // Short-handed formats use keys like "c6k" (6 on the field including a keeper) or "c4" (no keeper).
  var SHORT_LINES = { 1: [1, 0, 0], 2: [1, 0, 1], 3: [1, 1, 1], 4: [2, 0, 2], 5: [2, 1, 2], 6: [2, 3, 1], 7: [3, 3, 1], 8: [3, 3, 2], 9: [3, 4, 2], 10: [4, 4, 2] };
  function isFmt(key) {
    if (FORMATS[key]) return true;
    var m = /^c(\d{1,2})(k?)$/.exec(key || '');
    return !!m && +m[1] >= 3 && +m[1] <= 11;
  }
  function FMT(key) {
    if (FORMATS[key]) return FORMATS[key];
    var m = /^c(\d{1,2})(k?)$/.exec(key || '');
    if (!m) return FORMATS['5v5open'];
    var n = +m[1], k = !!m[2];
    return { size: n, keeper: k, short: true, def: SHORT_LINES[n - (k ? 1 : 0)].slice(),
             label: n + 'v' + n + (k ? ' (' + (n - 1) + ' + keeper)' : ', no keeper') + ', short-handed' };
  }
  function shortKey(full, n) {
    var F = FORMATS[full];
    if (n >= F.size) return full;
    var same = Object.keys(FORMATS).find(function (k) { return FORMATS[k].size === n && FORMATS[k].keeper === F.keeper; });
    return same || 'c' + n + (F.keeper ? 'k' : '');
  }
  function fullFor(fmt) {
    if (FORMATS[fmt]) return fmt;
    var f = FMT(fmt);
    return Object.keys(FORMATS).filter(function (k) { return FORMATS[k].keeper === f.keeper && FORMATS[k].size >= f.size; })
      .sort(function (a, b) { return FORMATS[a].size - FORMATS[b].size; })[0] || '11v11';
  }
  function fieldCount(fmt) { return FMT(fmt).size - (FMT(fmt).keeper ? 1 : 0); }
  function validLines(fmt, lines) {
    return Array.isArray(lines) && lines.length === 3 &&
      lines.every(function (n) { return n === (n | 0) && n >= 0 && n <= 5; }) && lines[2] <= 4 &&
      lines[0] >= 1 && lines[0] + lines[1] + lines[2] === fieldCount(fmt);
  }
  function fixLines(fmt, lines) { return validLines(fmt, lines) ? lines.slice() : FMT(fmt).def.slice(); }
  function allFormations(fmt) {
    var out = [], n = fieldCount(fmt);
    for (var d = 1; d <= 5; d++) for (var m = 5; m >= 0; m--) {
      var f = n - d - m;
      if (f >= 0 && f <= 4) out.push([d, m, f]);
    }
    // Common formations for this size come first.
    var common = COMMON_FORMS[fmt] || [];
    var rank = function (l) { var i = common.indexOf(l.filter(function (x) { return x > 0; }).join('-')); return i < 0 ? 99 : i; };
    return out.map(function (l, i) { return { l: l, r: rank(l), i: i }; })
      .sort(function (a, b) { return a.r - b.r || a.i - b.i; }).map(function (o) { return o.l; });
  }
  function formName(fmt, lines) {
    var s = lines.filter(function (x) { return x > 0; }).join('-');
    return (FMT(fmt).keeper ? 'Keeper + ' : '') + s;
  }
  function formDetail(lines) {
    var parts = [];
    if (lines[0]) parts.push(lines[0] + (lines[0] === 1 ? ' defender' : ' defenders'));
    if (lines[1]) parts.push(lines[1] + (lines[1] === 1 ? ' midfielder' : ' midfielders'));
    if (lines[2]) parts.push(lines[2] + (lines[2] === 1 ? ' forward' : ' forwards'));
    return parts.join(', ');
  }
  // Positions placed inside your own half: forwards near the center line, keeper at the bottom.
  function positionsFor(fmt, lines) {
    var keeper = FMT(fmt).keeper, res = [];
    var present = [['F', lines[2]], ['M', lines[1]], ['D', lines[0]]].filter(function (l) { return l[1] > 0; });
    var top = .1, bottom = keeper ? .62 : .74;
    present.forEach(function (l, i) {
      var y = present.length === 1 ? (top + bottom) / 2 : top + (bottom - top) * i / (present.length - 1);
      for (var j = 0; j < l[1]; j++) res.push({ key: l[0] + (j + 1), label: LINE_LABELS[l[0]][l[1]][j], x: LINE_X[l[1]][j], y: y });
    });
    if (keeper) res.push({ key: 'GK', label: 'GK', x: .5, y: .88 });
    return res;
  }
  function labelFor(fmt, lines, key) {
    var p = positionsFor(fmt, lines).find(function (x) { return x.key === key; });
    return p ? p.label : key;
  }
  // When the formation changes, players keep their spot if it still exists, otherwise fill open spots.
  function remapSlots(fmt, lines, slots) {
    var keys = positionsFor(fmt, lines).map(function (p) { return p.key; });
    var out = {}, leftover = [];
    Object.keys(slots).forEach(function (k) {
      if (!slots[k]) return;
      if (keys.indexOf(k) >= 0) out[k] = slots[k]; else leftover.push(slots[k]);
    });
    keys.forEach(function (k) { if (!out[k] && leftover.length && k !== 'GK') out[k] = leftover.shift(); });
    keys.forEach(function (k) { if (!out[k] && leftover.length) out[k] = leftover.shift(); });
    return out;
  }

  // ---------- Data ----------

  function uid(prefix) {
    return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function newTeam(name, ageGroup, color, id) {
    var d = defaultsFor(ageGroup);
    return { id: id || uid('t'), name: name, ageGroup: ageGroup, color: color, format: d.format, quarterMin: d.quarterMin, buildOut: d.buildOut, qv: 2,
             region: '', teamNumber: '', coach: '', asstCoach: '', players: [], games: [], lineups: [], practices: [] };
  }
  function defaultData() {
    return {
      app: 'soccer-coach', version: 3,
      activeTeamId: null,
      lastBackupAt: null, lastChangedAt: null,
      library: [],
      teams: []
    };
  }
  function str(v, max) { return (typeof v === 'string' ? v : (v == null ? '' : String(v))).slice(0, max || 1000); }
  function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
  function num(v, lo, hi, dflt) { v = Number(v); return isFinite(v) && v >= lo && v <= hi ? v : dflt; }
  function cleanSlots(s) {
    var out = {};
    Object.keys(obj(s)).forEach(function (k) { if (/^(GK|[DMF][1-5])$/.test(k) && typeof s[k] === 'string') out[k] = s[k].slice(0, 60); });
    return out;
  }

  function defaultsFor(age) {
    var d = AGE_DEFAULTS[age] || AGE_DEFAULTS['10U'];
    return { format: d[0], quarterMin: d[1], buildOut: d[0] === '7v7', total: d[2], ball: d[3], warmOnField: d[4] };
  }
  function ageLabel(age) { return age; }
  function cardRule(age) {
    var d = defaultsFor(age), f = FMT(d.format);

        var rest = cands.filter(function (c) { return remaining[c.id] < left; });
        rest.sort(function (x, y) {
          var rx = remaining[x.id] / left, ry = remaining[y.id] / left;
          if (rx !== ry) return ry - rx;
          var sx = prev.indexOf(x.id) >= 0 ? 1 : 0, sy = prev.indexOf(y.id) >= 0 ? 1 : 0;
          if (sx !== sy) return sx - sy;
          return x.r - y.r;
        });
        chosen = must.concat(rest.slice(0, Math.max(0, F - must.length)));
      }
      chosen.forEach(function (c) { remaining[c.id]--; });
      picks.push(chosen.map(function (c) { return c.id; }));
    }
    var posCount = {}, keeperCount = {};
    ps.forEach(function (p) { posCount[p.id] = {}; keeperCount[p.id] = season[p.id] ? season[p.id].keeper : 0; });
    var hasGK = FMT(g.format).keeper;
    var fieldKeys = pos.filter(function (p) { return p.key !== 'GK'; }).map(function (p) { return p.key; });
    picks.forEach(function (ids, q) {
      var slots = {};
      var others = ids.slice();
      if (hasGK && ids.length) {
        var gk = ids.map(function (id) { return { id: id, k: keeperCount[id], r: rnd() }; })
          .sort(function (a, b) { return a.k - b.k || a.r - b.r; })[0].id;
        slots.GK = gk; keeperCount[gk]++;
        others = ids.filter(function (id) { return id !== gk; });
      }
      var free = fieldKeys.slice();
      others.map(function (id) { return { id: id, r: rnd() }; }).sort(function (a, b) { return a.r - b.r; }).forEach(function (o) {
        if (!free.length) return;
        free.sort(function (x, y) { return (posCount[o.id][x[0]] || 0) - (posCount[o.id][y[0]] || 0) || (rnd() - .5); });
        var k = free.shift();
        slots[k] = o.id;
        posCount[o.id][k[0]] = (posCount[o.id][k[0]] || 0) + 1;
      });
      plan[q].slots = slots;
    });
    return plan;
  }

  function planWarnings(team, g) {
    var out = [];
    var F = FMT(g.format).size;
    var ps = playingPlayers(team, g), n = ps.length;
    if (!n) return [{ bad: true, text: 'No players are marked as playing. Set attendance on the Setup tab.' }];
    if (n < F) out.push({ bad: true, text: 'Only ' + n + ' players are available for ' + F + ' spots on the field.' });
    g.plan.forEach(function (pq, q) {
      var gap = Math.min(F, n) - Object.keys(pq.slots).length;
      if (gap > 0) out.push({ bad: false, text: 'Quarter ' + (q + 1) + ' has ' + plural(gap, 'empty spot') + '.' });
    });
    if (n > F) {
      var c = plannedCounts(team, g);
      var share = F * 4 / n, lo = Math.floor(share), hi = Math.ceil(share);
      ps.forEach(function (p) {
        var k = c[p.id];
        if (k < 2) out.push({ bad: true, text: p.name + ' is planned for ' + plural(k, 'quarter') + ', under half the game.' });
        else if (k < lo) out.push({ bad: false, text: p.name + ' is planned for ' + plural(k, 'quarter') + ', below a fair share.' });
        else if (k > hi) out.push({ bad: false, text: p.name + ' is planned for ' + plural(k, 'quarter') + ', above a fair share.' });
      });
      if (share !== lo) {
        var low = ps.filter(function (p) { return c[p.id] === lo; }), high = ps.filter(function (p) { return c[p.id] === hi; });
        if (low.length && high.length && low.length + high.length === n) {
          var names = function (arr) { return arr.map(function (p) { return firstName(p.name); }).join(', '); };
          out.push({ bad: false, text: 'Quarters can\'t split evenly with ' + n + ' players and ' + F + ' spots. ' +
            (high.length <= low.length
              ? names(high) + (high.length === 1 ? ' gets' : ' get') + ' an extra quarter. To even out minutes, sub ' + (high.length === 1 ? names(high) : 'them') + ' off for part of a quarter.'
              : names(low) + (low.length === 1 ? ' is' : ' are') + ' a quarter short. To even out minutes, sub ' + (low.length === 1 ? names(low) : 'them') + ' in for part of a quarter.') });
        }
      }
    }
    return out;
  }

  // ---------- Live game ----------

  function snapshot(L) {
    L.history.push(JSON.stringify({ onField: L.onField, stints: L.stints, lines: L.lines }));
    if (L.history.length > 10) L.history.shift();
  }
  function closeStint(L, pid, e) {
    L.stints.forEach(function (s) { if (s.pid === pid && s.q === L.q && s.to == null) s.to = e; });
  }
  function openStint(L, pid, pos, e) {
    if (L.qStarted && pid) L.stints.push({ pid: pid, pos: pos, q: L.q, from: e, to: null });
  }
  // Put a player (or nobody) at a spot. A player already on the field swaps spots.
  function liveAssign(L, pos, pid) {
    var e = elapsed(L);
    var outPid = L.onField[pos] || null;
    if (outPid === pid) return;
    snapshot(L);
    var fromPos = pid ? keyOf(L.onField, pid) : null;
    if (L.qStarted) {
      if (outPid) closeStint(L, outPid, e);
      if (pid && fromPos) closeStint(L, pid, e);
    }
    if (fromPos) {
      if (outPid) { L.onField[fromPos] = outPid; openStint(L, outPid, fromPos, e); }
      else delete L.onField[fromPos];
    }
    if (pid) { L.onField[pos] = pid; openStint(L, pid, pos, e); } else delete L.onField[pos];
  }
  // Switch the whole field to a lineup. Kids who stay on keep earning time without a break.
  function liveApplyLineup(L, lines, slots) {
    var e = elapsed(L);
    snapshot(L);
    var stay = {};
    Object.keys(slots).forEach(function (k) { stay[slots[k]] = 1; });
    if (L.qStarted) {
      Object.keys(L.onField).forEach(function (k) { if (!stay[L.onField[k]]) closeStint(L, L.onField[k], e); });
      var already = {};
      Object.keys(L.onField).forEach(function (k) { already[L.onField[k]] = 1; });
      Object.keys(slots).forEach(function (k) { if (!already[slots[k]]) openStint(L, slots[k], k, e); });
    }
    L.lines = lines.slice();
    L.onField = Object.assign({}, slots);
  }
  function sameLineup(a, b) {
    var ka = Object.keys(a), kb = Object.keys(b);
    return ka.length === kb.length && ka.every(function (k) { return a[k] === b[k]; });
  }

  // ---------- Field drawings ----------

  // Your half of the field. With goalAtTop it's flipped (for attacking set plays).
  // The build-out line sits halfway between the top of the penalty area and the center line.
  function halfPitch(goalAtTop, boxes, buildOut) {
    var s = '<rect width="100" height="100" fill="#2F7D4B"/>';
    for (var i = 0; i < 8; i += 2) s += '<rect x="0" y="' + (i * 100 / 8) + '" width="100" height="' + (100 / 8) + '" fill="#2B7446"/>';
    s += '<g ' + (goalAtTop ? 'transform="translate(0 100) scale(1 -1)" ' : '') + 'fill="none" stroke="rgba(255,255,255,.9)" stroke-width=".7">' +
         '<rect x="4" y="4" width="92" height="92"/><path d="M40 4 A10 10 0 0 0 60 4"/>' +
         '<rect x="36" y="88" width="28" height="8"/>' + (boxes ? '<rect x="24" y="76" width="52" height="20"/>' : '') +
         '<rect x="42" y="96" width="16" height="2.7"/><circle cx="50" cy="4" r=".9" fill="#fff" stroke="none"/>' +
         (buildOut ? '<line x1="4" y1="40" x2="96" y2="40" stroke-dasharray="3 2"/>' : '') + '</g>';
    return s;
  }
  function pitchSVG(team, fmt, lines, slots, action) {
    var c = COLORS[team.color] || COLORS.blue;
    var s = '<svg class="pitch" viewBox="0 0 100 100" role="img" aria-label="Field diagram, your half">' + halfPitch(false, FMT(fmt).keeper, team.buildOut);
    var sc = FMT(fmt).size >= 9 ? ' scale(.82)' : '';
    positionsFor(fmt, lines).forEach(function (p) {
      var pid = slots[p.key], pl = pid ? playerById(team, pid) : null;
      var tx = (4 + 92 * p.x).toFixed(1), ty = (4 + 92 * p.y).toFixed(1);
      s += '<g class="mk" data-action="' + action + '" data-pos="' + p.key + '" transform="translate(' + tx + ' ' + ty + ')' + sc + '" role="button" aria-label="' +
           esc(POS_NAMES[p.label] + (pl ? ': ' + pl.name : ': empty')) + '"><circle r="10" fill="transparent"/>';
      if (pl) {
        var isGK = p.key === 'GK';
        var bg = isGK ? '#F2C230' : c.bg, fg = isGK ? '#1A1A1A' : c.fg;
        s += '<text class="mk-pos" y="-7.9">' + p.label + '</text>';
        s += '<circle r="6.6" fill="' + bg + '" stroke="#fff" stroke-width="1"/>';
        s += '<text y="2.5" text-anchor="middle" font-size="7" font-weight="800" fill="' + fg + '">' + (pl.number !== '' ? esc(pl.number) : '?') + '</text>';
        s += '<text class="mk-name" y="11.8">' + esc(firstName(pl.name)) + '</text>';
      } else {
        s += '<circle r="6.6" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width=".8" stroke-dasharray="2 1.4"/>';
        s += '<text y="1.6" text-anchor="middle" font-size="4.2" font-weight="700" fill="#fff">' + p.label + '</text>';
      }
      s += '</g>';
    });
    return s + '</svg>' + (team.buildOut ? '<div class="legend"><span>Dashed line: build-out line</span></div>' : '');
  }

  // ---------- Saved lineups ----------

  function teamFormat(team) { return teamSettings(team).format; }
  function findLineup(team, id) { return team.lineups.find(function (l) { return l.id === id; }) || null; }
  function lineupMissing(team, g, l) {
    return Object.keys(l.slots).filter(function (k) { var pid = l.slots[k]; return !playerById(team, pid) || att(g, pid) !== 'playing'; }).length;
  }
  function lineupOptions(team, g) {
    return team.lineups.filter(function (l) { return l.format === g.format; }).map(function (l) {
      var miss = lineupMissing(team, g, l);
      return { label: l.name, detail: formName(l.format, l.lines) + (miss ? ', ' + miss + ' not here' : ''), value: l.id };
    });
  }

  function renderLineupList(t) {
    var html = '<button class="back" data-action="lineups-back">‹ Games</button>';
    html += '<div class="team-head"><div><h1>Saved lineups</h1><p>' + esc(t.name) + ', ' + plural(t.lineups.length, 'lineup') + '</p></div>' +
            '<button class="btn btn-primary btn-small" data-action="lineup-new">New lineup</button></div>';
    if (!t.lineups.length) {
      return html + '<div class="empty"><p>Save lineups you like, such as your starters or a strong defense. Each lineup can use its own formation, and you can pick one for any quarter or switch to one mid-game.</p>' +
             '<button class="btn btn-primary" data-action="lineup-new">New lineup</button></div>';
    }
    html += '<ul class="roster">' + t.lineups.map(function (l) {
      var filled = Object.keys(l.slots).filter(function (k) { return playerById(t, l.slots[k]); }).length;
      return '<li><button class="list-row" data-action="lineup-open" data-id="' + esc(l.id) + '"><span class="main"><div class="title">' + esc(l.name) + '</div>' +
             '<div class="sub">' + esc(formName(l.format, l.lines)) + ', ' + FMT(l.format).label + ', ' + filled + ' of ' + FMT(l.format).size + ' filled</div></span></button></li>';
    }).join('') + '</ul>';
    return html;
  }

  function renderLineupEdit(t) {
    var l = lineupDraft;
    var fmtOpts = Object.keys(FORMATS).map(function (k) { return '<option value="' + k + '"' + (k === l.format ? ' selected' : '') + '>' + FORMATS[k].label + '</option>'; }).join('');
    var html = '<button class="back" data-action="lineup-cancel">‹ Saved lineups</button>';
    html += '<h1 class="game-title">' + (findLineup(t, l.id) ? 'Edit lineup' : 'New lineup') + '</h1>';
    html += '<section class="panel"><label class="field"><span>Lineup name</span><input data-ld="name" type="text" maxlength="40" value="' + esc(l.name) + '" placeholder="For example: Starters"></label>' +
            '<label class="field"><span>Format</span><select data-ld="format">' + fmtOpts + '</select></label>' +
            '<div class="lineup-bar"><div><div class="lb-name">' + esc(formName(l.format, l.lines)) + '</div><div class="lb-form">' + esc(formDetail(l.lines)) + '</div></div>' +
            '<button class="btn btn-quiet btn-small" data-action="ld-formation">Formation</button></div></section>';
    html += '<p class="blk-caption">Tap a spot to choose a player.</p>';
    html += pitchSVG(t, l.format, l.lines, l.slots, 'ld-pos');
    html += '<div class="toolrow"><button class="btn btn-primary" data-action="lineup-save">Save lineup</button>' +
            '<button class="btn btn-quiet" data-action="ld-clear">Clear players</button></div>';
    if (findLineup(t, l.id)) {
      html += '<div class="toolrow"><button class="btn btn-quiet" data-action="lineup-copy">Make a copy</button>' +
              '<button class="btn btn-danger" data-action="lineup-delete">Delete lineup</button></div>';
    }
    return html;
  }

  // ---------- Rendering: games ----------

  function renderGameList() {
    var t = activeTeam();
    var html = '<div class="team-head"><div><h1>Games</h1><p>' + esc(t.name) + ', ' +
               (t.games.length ? plural(t.games.length, 'game') : 'no games yet') + '</p></div>' +
               (t.players.length ? '<button class="btn btn-primary btn-small" data-action="new-game">New game</button>' : '') + '</div>';
    if (!t.players.length) {
      return html + '<div class="empty"><p>Add players to the roster before planning a game.</p>' +
             '<button class="btn btn-primary" data-action="nav" data-view="roster">Go to roster</button></div>';
    }
    html += '<button class="list-row panel" style="margin-bottom:14px;border:1px solid var(--rule);border-radius:14px" data-action="lineups-open">' +
            '<span class="main"><div class="title">Saved lineups</div><div class="sub">' + plural(t.lineups.length, 'lineup') + '. Build them once, use them any quarter.</div></span><span aria-hidden="true">›</span></button>';
    if (!t.games.length) {
      html += '<div class="empty"><p>Create a game to plan fair rotations, track playing time, and fill in your lineup card.</p>' +
              '<button class="btn btn-primary" data-action="new-game">New game</button></div>';
    } else {
      var games = t.games.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
      html += '<ul class="roster">' + games.map(function (g) {
        var pill = g.status === 'finished' ? '<span class="pill done">Finished</span>'
                 : g.status === 'live' ? '<span class="pill live">In progress</span>' : '<span class="pill">Planned</span>';
        return '<li><button class="game-row" data-action="open-game" data-id="' + esc(g.id) + '">' +
               '<span class="gdate">' + esc(fmtDate(g.date, { weekday: 'short' })) + '<b>' + esc(fmtDate(g.date, { month: 'short', day: 'numeric' })) + '</b></span>' +
               '<span class="gname">vs ' + esc(g.opponent || 'Opponent not set') + '</span>' + pill + '</button></li>';
      }).join('') + '</ul>';
    }
    html += renderSeason(t);
    return html;
  }

  function renderSeason(t) {
    var finished = t.games.filter(function (g) { return g.status === 'finished'; }).length;
    var html = '<h2 class="section-title">Season playing time</h2>';
    if (!finished) return html + '<p class="meta">Totals appear here once you finish a game. Only finished games count.</p>';
    var st = seasonStats(t);
    html += '<p class="meta">From ' + plural(finished, 'finished game') + '. The rotation planner gives extra time to kids with the lowest totals.</p>';
    html += '<div class="tbl-wrap"><table class="grid"><thead><tr><th>#</th><th class="l">Player</th><th>Games</th><th>Quarters</th><th>Minutes</th></tr></thead><tbody>' +
      sortedPlayers(t).map(function (p) {
        var s = st[p.id];
        return '<tr><td class="num">' + esc(p.number || '?') + '</td><td class="l">' + esc(p.name) + '</td><td>' + s.games + '</td><td>' + s.quarters +
               '</td><td>' + Math.round(s.secs / 60) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    return html;
  }

  function renderGame(t, g) {
    var html = '<button class="back" data-action="close-game">‹ All games</button>';
    html += '<h1 class="game-title">vs ' + esc(g.opponent || 'Opponent not set') + '</h1>';
    html += '<p class="game-sub">' + esc(fmtDate(g.date, { weekday: 'long', month: 'long', day: 'numeric' })) + ', ' + FMT(g.format).label + '</p>';
    html += '<div class="seg" role="tablist">' + [['setup', 'Setup'], ['plan', 'Plan'], ['live', 'Live'], ['card', 'Card']].map(function (x) {
      return '<button data-action="game-tab" data-tab="' + x[0] + '" aria-current="' + (gameTab === x[0]) + '">' + x[1] + '</button>';
    }).join('') + '</div>';
    if (gameTab === 'setup') html += renderSetup(t, g);
    else if (gameTab === 'plan') html += renderPlan(t, g);
    else if (gameTab === 'live') html += renderLive(t, g);

    return html;
  }

  function renderSetup(t, g) {
    var locked = hasLiveData(g);
    var fmtOpts = Object.keys(FORMATS).map(function (k) { return '<option value="' + k + '"' + (k === g.full ? ' selected' : '') + '>' + FORMATS[k].label + '</option>'; }).join('');
    var FS = FORMATS[g.full], cur = FMT(g.format).size, minN = 3, nOpts = '';
    for (var n = FS.size; n >= minN; n--) {
      nOpts += '<option value="' + n + '"' + (n === cur ? ' selected' : '') + '>' + n + 'v' + n +
               (FS.keeper ? ' (' + (n - 1) + ' + keeper)' : '') + (n === FS.size ? ', full side' : ', short-handed') + '</option>';
    }
    var html = '<section class="panel">' +
      '<label class="field"><span>Opponent</span><input data-setup="opponent" type="text" maxlength="60" autocomplete="off" value="' + esc(g.opponent) + '" placeholder="Team name"></label>' +
      '<label class="field"><span>Date</span><input data-setup="date" type="date" value="' + esc(g.date) + '"></label>' +
      '<label class="field"><span>Format</span><select data-setup="format"' + (locked ? ' disabled' : '') + '>' + fmtOpts + '</select></label>' +
      '<label class="field"><span>Players on the field</span><select data-setup="onfield"' + (locked ? ' disabled' : '') + '>' + nOpts + '</select></label>' +
      (FMT(g.format).short ? '<p class="hint">Playing short-handed. Both teams should field the same number. Saved lineups only work at full side.</p>' : '') +
      '<div class="lineup-bar"><div><div class="lb-name">Usual formation: ' + esc(formName(g.format, g.lines)) + '</div><div class="lb-form">' + esc(formDetail(g.lines)) + '. Used by Suggest rotation and empty quarters.</div></div>' +
      '<button class="btn btn-quiet btn-small" data-action="game-formation">Change</button></div>' +
      '<label class="field"><span>Quarter length (minutes)</span><input data-setup="quarterMin" type="number" inputmode="decimal" min="1" max="45" step="0.5" value="' + g.quarterMin + '"></label>' +
