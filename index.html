    html += '</section>';
    html += '<section class="panel"><h2>Storage</h2><p id="persistStatus" class="meta">' +
            (storageOk ? 'Checking...' : 'This browser is blocking storage, so nothing will be saved. Private browsing mode is the usual cause.') + '</p></section>';
    html += '<p class="version">Soccer Coach ' + APP_VERSION + ', phase 2</p>';
    return html;
  }
  function updatePersistStatus() {
    var el = $('persistStatus');
    if (!el || !storageOk) return;
    if (!navigator.storage || !navigator.storage.persisted) {
      el.textContent = 'This browser may clear app data if the app goes unused for a while. Backups are your safety net.';
      return;
    }
    navigator.storage.persisted().then(function (yes) {
      el.textContent = yes
        ? 'Protected. This browser has agreed not to clear the app\'s data on its own. Keep making backups anyway.'
        : 'Not protected yet. The browser may clear data from apps that go unused for a while. Installing the app helps, and backups are your safety net.';
    }).catch(function () {});
  }

  function currentGame() { return gameId ? findGame(activeTeam(), gameId) : null; }

  function render() {
    applyTeamColor();
    renderTabs();
    var t = activeTeam();
    var g = view === 'game' ? currentGame() : null;
    if (view === 'game' && gameId && !g) gameId = null;
    var html;
    if (view === 'roster') html = renderRoster();
    else if (view === 'game') html = g ? renderGame(t, g) : renderGameList();
    else if (view === 'practice') html = renderSoon('Practice', 3, 'Build a drill library, stack drills into timed practice plans, and take attendance.');
    else if (view === 'rules') html = renderSoon('Rules', 4, 'Plain-language rules of the game, your region\'s small-sided rules, positions explained, and your own saved manuals.');
    else html = renderMore();
    $('main').innerHTML = html;
    $('fab').hidden = view !== 'roster' || t.players.length === 0;
    document.querySelectorAll('.tab').forEach(function (b) {
      if (b.dataset.view === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('teamTabs').style.display = (view === 'roster' || (view === 'game' && !g)) ? '' : 'none';
    if (view === 'more') updatePersistStatus();
    manageWakeLock();
  }

  // ---------- Live clock ticking and screen wake ----------

  function tick() {
    if (view !== 'game' || gameTab !== 'live') return;
    var t = activeTeam(), g = currentGame();
    if (!g || !g.live || g.live.ended) return;
    var L = g.live, e = elapsed(L), Q = g.quarterMin * 60;
    var c = $('liveClock'); if (c) c.textContent = clock(e);
    var m = $('liveMeta');
    if (m) { m.textContent = e >= Q ? 'Time\'s up. End the quarter at the whistle.' : 'of ' + clock(Q); m.classList.toggle('over', e >= Q); }
    if (!L.running) return;
    var mins = minutesFor(t, g);
    var ps = playingPlayers(t, g);
    var max = Math.max(60, Math.max.apply(null, ps.map(function (p) { return mins[p.id] || 0; })));
    var avg = ps.length ? ps.reduce(function (s, p) { return s + (mins[p.id] || 0); }, 0) / ps.length : 0;
    ps.forEach(function (p) {
      var el = document.querySelector('[data-min="' + p.id + '"]'); if (el) el.textContent = clock(mins[p.id] || 0);
      var bar = document.querySelector('[data-bar="' + p.id + '"]');
      if (bar) { bar.style.width = Math.round(100 * (mins[p.id] || 0) / max) + '%'; bar.classList.toggle('low', avg > 60 && (mins[p.id] || 0) < avg / 2); }
    });
  }
  setInterval(tick, 1000);

  var wakeLock = null;
  function manageWakeLock() {
    var g = view === 'game' && gameTab === 'live' ? currentGame() : null;
    var want = !!(g && g.live && !g.live.ended);
    if (want && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () {});
    } else if (!want && wakeLock) {
      wakeLock.release().catch(function () {});
      wakeLock = null;
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { manageWakeLock(); if (view === 'game') render(); }
  });

  // ---------- Picker sheet ----------

  var pickOptions = [], pickCallback = null;
  function openPicker(title, sub, options, cb) {
    pickOptions = options; pickCallback = cb;
    $('pickTitle').textContent = title;
    $('pickSub').textContent = sub || '';
    $('pickSub').hidden = !sub;
    $('pickList').innerHTML = options.map(function (o, i) {
      return '<button class="pick-row' + (o.muted ? ' empty-opt' : '') + '" data-action="pick" data-i="' + i + '">' +
             (o.player !== undefined ? (o.player ? jmini(o.player) : '<span class="jmini" style="background:transparent;color:var(--muted)">–</span>') : '') +
             '<span class="nm">' + esc(o.label) + '</span>' + (o.detail ? '<span class="dt">' + esc(o.detail) + '</span>' : '') + '</button>';
    }).join('');
    $('pickDialog').showModal();
  }

  function pickForPlanPos(t, g, pos) {
    var blk = g.plan[planBlock];
    var counts = plannedCounts(t, g);
    var current = blk[pos] ? playerById(t, blk[pos]) : null;
    var ps = playingPlayers(t, g);
    var bench = ps.filter(function (p) { return !keyOf(blk, p.id); }).sort(function (a, b) { return counts[a.id] - counts[b.id]; });
    var onField = ps.filter(function (p) { var k = keyOf(blk, p.id); return k && k !== pos; });
    var opts = bench.map(function (p) { return { label: p.name, detail: qtrs(counts[p.id]) + ' qtrs planned', player: p, value: p.id }; })
      .concat(onField.map(function (p) { return { label: p.name, detail: 'Swap from ' + keyOf(blk, p.id), player: p, value: p.id }; }));
    if (current) opts.push({ label: 'Leave this spot empty', player: null, value: null, muted: true });
    openPicker(POS_NAMES[pos], BLOCK_NAMES[planBlock] + (current ? '. Now: ' + current.name : ''), opts, function (pid) {
      var from = pid ? keyOf(blk, pid) : null;
      var old = blk[pos] || null;
      if (from) { if (old) blk[from] = old; else delete blk[from]; }
      if (pid) blk[pos] = pid; else delete blk[pos];
      commit(); render();
    });
  }

  function pickForLivePos(t, g, pos) {
    var L = g.live;
    var mins = minutesFor(t, g);
    var current = L.onField[pos] ? playerById(t, L.onField[pos]) : null;
    var ps = playingPlayers(t, g);
    var bench = ps.filter(function (p) { return !keyOf(L.onField, p.id); }).sort(function (a, b) { return (mins[a.id] || 0) - (mins[b.id] || 0); });
    var onField = ps.filter(function (p) { var k = keyOf(L.onField, p.id); return k && k !== pos; });
    var opts = bench.map(function (p) { return { label: p.name, detail: clock(mins[p.id] || 0) + ' played', player: p, value: p.id }; })
      .concat(onField.map(function (p) { return { label: p.name, detail: 'Swap from ' + keyOf(L.onField, p.id), player: p, value: p.id }; }));
    if (current) opts.push({ label: 'Take off with no replacement', player: null, value: null, muted: true });
    var title = current ? 'Sub for ' + jerseyText(current) + current.name : 'Fill ' + POS_NAMES[pos];
    openPicker(title, POS_NAMES[pos] + (L.qStarted ? '. Remember: mid-quarter subs only when your team has the ball.' : ''), opts, function (pid) {
      liveAssign(L, pos, pid);
      commit(); render();
    });
  }

  // ---------- Player dialog ----------

  var editingPlayerId = null;
  function openPlayer(id) {
    var t = activeTeam();
    var p = id ? t.players.find(function (x) { return x.id === id; }) : null;
    editingPlayerId = p ? p.id : null;
    var f = $('playerForm');
    $('playerTitle').textContent = p ? 'Edit player' : 'Add player to ' + t.name;
    f.number.value = p ? p.number : '';
    f.name.value = p ? p.name : '';
    f.notes.value = p ? p.notes : '';
    $('playerError').textContent = '';
    $('deletePlayerRow').hidden = !p;
    $('playerDialog').showModal();
    if (!p) setTimeout(function () { f.number.focus(); }, 50);
  }
  $('playerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, t = activeTeam();
    var number = f.number.value.trim();
    var name = f.name.value.trim().replace(/\s+/g, ' ');
    var err = $('playerError');
    if (number !== '' && !/^\d{1,2}$/.test(number)) { err.textContent = 'Jersey numbers are 0 to 99. Leave it blank if you don\'t know it yet.'; return; }
    if (!name) { err.textContent = 'Enter the player\'s name.'; f.name.focus(); return; }
    var clash = number !== '' && t.players.find(function (x) { return x.number === number && x.id !== editingPlayerId; });
    if (clash) { err.textContent = '#' + number + ' already belongs to ' + clash.name + '. Pick another number.'; f.number.focus(); return; }
    if (editingPlayerId) {
      var p = t.players.find(function (x) { return x.id === editingPlayerId; });
      p.number = number; p.name = name; p.notes = f.notes.value.trim();
    } else {
      var np = { id: uid('p'), number: number, name: name, notes: f.notes.value.trim() };
      t.players.push(np);
      // New players join any game that hasn't been played yet.
      t.games.forEach(function (g) { if (g.status === 'planned') g.attendance[np.id] = 'playing'; });
    }
    commit();
    $('playerDialog').close();
    render();
    toast(editingPlayerId ? 'Saved ' + name : 'Added ' + name);
  });
  $('deletePlayerBtn').addEventListener('click', function () {
    var t = activeTeam();
    var p = t.players.find(function (x) { return x.id === editingPlayerId; });
    if (!p) return;
    var inGames = t.games.some(function (g) { return g.status === 'finished' && att(g, p.id) !== 'none'; });
    if (!confirm('Remove ' + p.name + ' from the ' + t.name + ' roster?' + (inGames ? ' They will also disappear from past lineup cards and season totals.' : ''))) return;
    t.players = t.players.filter(function (x) { return x.id !== p.id; });
    commit();
    $('playerDialog').close();
    render();
    toast('Removed ' + p.name);
  });

  // ---------- Team dialog ----------

  var editingTeamId = null;
  $('colorSwatches').insertAdjacentHTML('beforeend', Object.keys(COLORS).map(function (k) {
    return '<label class="swatch" title="' + COLORS[k].label + '"><input type="radio" name="color" value="' + k + '" aria-label="' + COLORS[k].label + '">' +
           '<span style="background:' + COLORS[k].bg + '"></span></label>';
  }).join(''));
  function openTeam(isNew) {
    var t = isNew ? null : activeTeam();
    editingTeamId = t ? t.id : null;
    var f = $('teamForm');
    $('teamTitle').textContent = t ? 'Edit team' : 'Add team';
    f.name.value = t ? t.name : '';
    f.ageGroup.value = t ? t.ageGroup : '8U';
    f.region.value = t ? t.region : '';
    f.teamNumber.value = t ? t.teamNumber : '';
    f.coach.value = t ? t.coach : (data.teams[0] ? data.teams[0].coach : '');
    f.asstCoach.value = t ? t.asstCoach : '';
    var color = t ? t.color : 'green';
    f.querySelectorAll('input[name="color"]').forEach(function (r) { r.checked = r.value === color; });
    $('teamError').textContent = '';
    $('deleteTeamRow').hidden = !t || data.teams.length < 2;
    $('teamDialog').showModal();
  }
  $('teamForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var name = f.name.value.trim().replace(/\s+/g, ' ');
    if (!name) { $('teamError').textContent = 'Enter a team name.'; f.name.focus(); return; }
    var picked = f.querySelector('input[name="color"]:checked');
    var fields = {
      name: name, ageGroup: f.ageGroup.value, color: picked ? picked.value : 'blue',
      region: f.region.value.trim(), teamNumber: f.teamNumber.value.trim(),
      coach: f.coach.value.trim(), asstCoach: f.asstCoach.value.trim()
    };
    if (editingTeamId) Object.assign(activeTeam(), fields);
    else {
      var t = newTeam(fields.name, fields.ageGroup, fields.color);
      Object.assign(t, fields);
      data.teams.push(t);
      data.activeTeamId = t.id;
      view = 'roster';
    }
    commit();
    $('teamDialog').close();
    render();
    toast('Saved ' + name);
  });
  $('deleteTeamBtn').addEventListener('click', function () {
    var t = activeTeam(), n = t.players.length;
    var msg = 'Delete ' + t.name + (n ? ' and its ' + n + (n === 1 ? ' player' : ' players') : '') + ' and all its games? This can\'t be undone unless you have a backup.';
    if (!confirm(msg)) return;
    data.teams = data.teams.filter(function (x) { return x.id !== t.id; });
    data.activeTeamId = data.teams[0].id;
    gameId = null;
    commit();
    $('teamDialog').close();
    render();
    toast('Deleted ' + t.name);
  });

  document.querySelectorAll('dialog').forEach(function (d) {
    d.addEventListener('click', function (e) { if (e.target === d) d.close(); });
    d.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { d.close(); }); });
  });

  // ---------- Backup and restore ----------

  function dateStamp() { return today(); }
  function markBackedUp() {
    data.lastBackupAt = new Date().toISOString();
    persist(); render(); toast('Backup saved');
  }
  function exportBackup() {
    var json = JSON.stringify({ app: 'soccer-coach', kind: 'backup', exportedAt: new Date().toISOString(), data: data }, null, 2);
    var name = 'soccer-coach-backup-' + dateStamp() + '.json';
    var file;
    try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (file && touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Soccer Coach backup' })
        .then(markBackedUp)
        .catch(function (err) { if (err && err.name !== 'AbortError') downloadFile(json, name); });
      return;
    }
    downloadFile(json, name);
  }
  function downloadFile(text, name) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    markBackedUp();
  }
  $('importInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed, restored;
      try {
        parsed = JSON.parse(reader.result);
        if (!parsed || parsed.app !== 'soccer-coach') throw new Error('wrong app');
        restored = normalize(parsed.data);
      } catch (err) {
        alert('That file isn\'t a Soccer Coach backup. Pick a file named like soccer-coach-backup-2026-09-27.json.');
        return;
      }
      var players = restored.teams.reduce(function (n, t) { return n + t.players.length; }, 0);
      var games = restored.teams.reduce(function (n, t) { return n + t.games.length; }, 0);
      var when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : 'an unknown date';
      if (!confirm('Restore the backup from ' + when + '? It has ' + restored.teams.length + ' teams, ' + players +
                   ' players, and ' + games + ' games, and it replaces everything currently on this device.')) return;
      restored.lastBackupAt = parsed.exportedAt || new Date().toISOString();
      restored.lastChangedAt = restored.lastBackupAt;
      data = restored;
      persist();
      view = 'roster'; gameId = null;
      render();
      toast('Backup restored');
    };
    reader.onerror = function () { alert('Could not read that file. Try picking it again.'); };
    reader.readAsText(file);
  });

  // ---------- Game setup changes ----------

  document.addEventListener('change', function (e) {
    var el = e.target;
    var t = activeTeam(), g = currentGame();
    if (el.name === 'halfRule') { data.settings.halfRule = el.value; commit(); render(); return; }
    if (!g) return;
    if (el.dataset.setup) {
      var k = el.dataset.setup;
      if (k === 'opponent') g.opponent = el.value.trim().slice(0, 60);
      else if (k === 'date') { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) g.date = el.value; }
      else if (k === 'quarterMin') g.quarterMin = num(el.value, 1, 45, g.quarterMin);
      else if (k === 'format') {
        var hasPlan = g.plan.some(function (b) { return Object.keys(b).length; });
        if (hasPlan && !confirm('Changing the format clears your rotation plan. Continue?')) { render(); return; }
        g.format = el.value;
        g.formation = Object.keys(FORMATS[g.format].formations)[0];
        g.plan = emptyPlan();
        if (g.live) g.live.onField = {};
      } else if (k === 'formation') {
        // Keep the same kids in the same slot order when switching formations.
        var oldKeys = positions(g).map(function (p) { return p.key; });
        g.formation = el.value;
        var newKeys = positions(g).map(function (p) { return p.key; });
        function remap(m) { var o = {}; oldKeys.forEach(function (ok, i) { if (m[ok]) o[newKeys[i]] = m[ok]; }); return o; }
        g.plan = g.plan.map(remap);
        if (g.live) {
          g.live.onField = remap(g.live.onField);
          g.live.stints.forEach(function (s) { var i = oldKeys.indexOf(s.pos); if (i >= 0) s.pos = newKeys[i]; });
        }
      }
      commit(); render(); return;
    }
    if (el.dataset.att) {
      g.attendance[el.dataset.att] = el.value;
      if (el.value !== 'absent') delete g.absentReason[el.dataset.att];
      if (el.value !== 'playing') {
        cleanPlan(t, g);
        if (g.live) { var k2 = keyOf(g.live.onField, el.dataset.att); if (k2) liveAssign(g.live, k2, null); }
      }
      commit(); render(); return;
    }
    if (el.dataset.why) { g.absentReason[el.dataset.why] = el.value; commit(); return; }
  });

  // ---------- Taps ----------

  var suggestAttempt = 0;
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.dataset.action;
    var t = activeTeam(), g = currentGame();

    if (a === 'nav') { view = el.dataset.view; if (view !== 'game') gameId = null; else if (el.closest('.tabbar')) gameId = null; render(); window.scrollTo(0, 0); }
    else if (a === 'switch-team') { data.activeTeamId = el.dataset.id; gameId = null; persist(); render(); }
    else if (a === 'add-team') openTeam(true);
    else if (a === 'edit-team') openTeam(false);
    else if (a === 'add-player') openPlayer(null);
    else if (a === 'edit-player') openPlayer(el.dataset.id);
    else if (a === 'export') exportBackup();
    else if (a === 'import') $('importInput').click();
    else if (a === 'apply-update') applyUpdate();
    else if (a === 'pick') {
      var opt = pickOptions[+el.dataset.i], cb = pickCallback;
      $('pickDialog').close();
      if (opt && cb) cb(opt.value);
    }
    else if (a === 'new-game') {
      var ng = newGame(t);
      t.games.push(ng);
      gameId = ng.id; gameTab = 'setup'; planBlock = 0;
      commit(); render(); window.scrollTo(0, 0);
    }
    else if (a === 'open-game') {
      gameId = el.dataset.id; planBlock = 0;
      var og = currentGame();
      gameTab = og && og.status === 'live' ? 'live' : og && og.status === 'finished' ? 'card' : 'setup';
      render(); window.scrollTo(0, 0);
    }
    else if (a === 'close-game') { gameId = null; render(); window.scrollTo(0, 0); }
    else if (!g) return;
    else if (a === 'game-tab') { gameTab = el.dataset.tab; render(); window.scrollTo(0, 0); }
    else if (a === 'delete-game') {
      if (!confirm('Delete the game vs ' + (g.opponent || 'opponent not set') + '? Its plan and playing-time record will be gone.')) return;
      t.games = t.games.filter(function (x) { return x.id !== g.id; });
      gameId = null; commit(); render(); toast('Game deleted');
    }
    else if (a === 'reset-live') {
      if (!confirm('Clear the live clock, subs, and times for this game? Your rotation plan stays.')) return;
      g.live = null; g.status = 'planned'; commit(); render();
    }
    // Plan
    else if (a === 'plan-block') { planBlock = +el.dataset.b; render(); }
    else if (a === 'plan-pos') pickForPlanPos(t, g, el.dataset.pos);
    else if (a === 'bench-plan') {
      var p = playerById(t, el.dataset.id), blk = g.plan[planBlock];
      var opts = positions(g).map(function (ps) {
        var cur = blk[ps.key] ? playerById(t, blk[ps.key]) : null;
        return { label: POS_NAMES[ps.key], detail: cur ? 'Replaces ' + firstName(cur.name) : 'Empty', value: ps.key };
      });
      openPicker('Put ' + p.name + ' in', BLOCK_NAMES[planBlock], opts, function (key) {
        blk[key] = p.id; commit(); render();
      });
    }
    else if (a === 'suggest') {
      var has = g.plan.some(function (b) { return Object.keys(b).length; });
      if (has && !confirm('Replace your current rotation plan with a new suggestion?')) return;
      suggestAttempt++;
      g.plan = suggestPlan(t, g, suggestAttempt);
      planBlock = 0;
      commit(); render(); toast('Rotation suggested. Adjust positions as you like.');
    }
    else if (a === 'copy-prev') { g.plan[planBlock] = Object.assign({}, g.plan[planBlock - 1]); commit(); render(); }
    else if (a === 'clear-block') { g.plan[planBlock] = {}; commit(); render(); }
    // Live
    else if (a === 'live-begin') {
      g.live = normalizeLive({ onField: validLineup(t, g, g.plan[0]) });
      g.status = 'live'; commit(); render();
    }
    else if (a === 'live-start') {
      var L = g.live; L.qStarted = true; L.running = true; L.startedAt = Date.now(); L.elapsedBefore = 0; L.history = [];
      Object.keys(L.onField).forEach(function (k) { openStint(L, L.onField[k], k, 0); });
      commit(); render();
    }
    else if (a === 'live-pause') { g.live.elapsedBefore = elapsed(g.live); g.live.running = false; g.live.startedAt = null; commit(); render(); }
    else if (a === 'live-resume') { g.live.running = true; g.live.startedAt = Date.now(); commit(); render(); }
    else if (a === 'live-end') {
      var L2 = g.live;
      if (!confirm('End quarter ' + (L2.q + 1) + ' at ' + clock(elapsed(L2)) + '?')) return;
      var e2 = elapsed(L2);
      L2.stints.forEach(function (s) { if (s.q === L2.q && s.to == null) s.to = e2; });
      L2.qDur[L2.q] = e2;
      L2.running = false; L2.startedAt = null; L2.elapsedBefore = 0; L2.qStarted = false; L2.history = [];
      if (L2.q >= 3) {
        L2.ended = true; L2.q = 4; g.status = 'finished';
        commit(); gameTab = 'card'; render(); window.scrollTo(0, 0); toast('Game finished. Here is your lineup card.');
        return;
      }
      L2.q++;
      var next = validLineup(t, g, g.plan[L2.q * 2]);
      if (Object.keys(next).length) L2.onField = next;
      commit(); render(); window.scrollTo(0, 0);
    }
    else if (a === 'live-apply') {
      var L3 = g.live;
      liveApplyLineup(L3, validLineup(t, g, L3.qStarted ? g.plan[L3.q * 2 + 1] : g.plan[L3.q * 2]));
      commit(); render(); toast(L3.qStarted ? 'Subs made' : 'Planned lineup loaded');
    }
    else if (a === 'live-pos') pickForLivePos(t, g, el.dataset.pos);
    else if (a === 'live-undo') {
      var L4 = g.live, snap = L4.history.pop();
      if (snap) { var s = JSON.parse(snap); L4.onField = s.onField; L4.stints = s.stints; commit(); render(); toast('Last change undone'); }
    }
    else if (a === 'live-goal') {
      var L5 = g.live;
      var on = playingPlayers(t, g).filter(function (p) { return keyOf(L5.onField, p.id); });
      var off = playingPlayers(t, g).filter(function (p) { return !keyOf(L5.onField, p.id); });
      openPicker('Who scored?', null, on.concat(off).map(function (p) {
        return { label: p.name, detail: (g.goals[p.id] || 0) + ' so far', player: p, value: p.id };
      }), function (pid) { g.goals[pid] = (g.goals[pid] || 0) + 1; commit(); render(); toast('Goal for ' + playerById(t, pid).name); });
    }
    // Card
    else if (a === 'toggle-hq') {
      var pid = el.dataset.id, b = +el.dataset.b;
      var base = credits(t, g, true)[pid][b], cur = credits(t, g)[pid][b];
      var nv = !cur;
      g.overrides[pid] = obj(g.overrides[pid]);
      if (nv === base) delete g.overrides[pid][b]; else g.overrides[pid][b] = nv;
      commit(); render();
    }
    else if (a === 'goal-plus') { g.goals[el.dataset.id] = (g.goals[el.dataset.id] || 0) + 1; commit(); render(); }
    else if (a === 'goal-minus') { g.goals[el.dataset.id] = Math.max(0, (g.goals[el.dataset.id] || 0) - 1); commit(); render(); }
    else if (a === 'finish-game') {
      if (g.live && !g.live.ended && g.live.qStarted && !confirm('Live tracking is still running. Finish the game anyway?')) return;
      if (g.live && g.live.qStarted) {
        var e3 = elapsed(g.live);
        g.live.stints.forEach(function (s) { if (s.to == null) s.to = e3; });
        g.live.qDur[g.live.q] = e3;
        g.live.running = false; g.live.qStarted = false;
      }
      if (g.live) g.live.ended = true;
      g.status = 'finished'; commit(); render(); toast('Game finished');
    }
    else if (a === 'reopen-game') { g.status = g.live && !g.live.ended ? 'live' : 'planned'; commit(); render(); }
  });

  // ---------- Offline support and updates ----------

  var waitingWorker = null, updateRequested = false;
  function showUpdate(worker) { waitingWorker = worker; $('updateBanner').hidden = false; }
  function applyUpdate() {
    updateRequested = true;
    if (waitingWorker) waitingWorker.postMessage('skipWaiting'); else location.reload();
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', function () {
            if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
          });
        });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update().catch(function () {});
        });
      }).catch(function (err) { console.warn('Offline support unavailable:', err); });
      navigator.serviceWorker.addEventListener('controllerchange', function () { if (updateRequested) location.reload(); });
    });
  }

  render();
})();
</script>
</body>
</html>
